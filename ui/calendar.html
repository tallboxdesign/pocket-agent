<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <title>Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #141415;
      --bg-tertiary: #1c1c1e;
      --border: #2a2a2d;
      --text-primary: #fafafa;
      --text-secondary: #a1a1a6;
      --text-muted: #636366;
      --accent: #a855f7;
      --accent-secondary: #ec4899;
      --accent-hover: #c084fc;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: var(--bg-secondary);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header h1 span {
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-actions button {
      padding: 6px 14px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .header-actions button:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%) !important;
      color: white !important;
      border: none !important;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.25);
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent) 100%) !important;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35) !important;
    }

    .month-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 160px;
      text-align: center;
    }

    /* Main layout */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Calendar grid */
    .calendar-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 12px;
    }

    .weekday-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      margin-bottom: 4px;
    }

    .weekday-cell {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .days-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 1px;
    }

    .day-cell {
      background: var(--bg-secondary);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 4px 6px;
      cursor: pointer;
      transition: all 0.12s;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .day-cell:hover {
      border-color: var(--border);
      background: var(--bg-tertiary);
    }

    .day-cell.other-month {
      opacity: 0.3;
    }

    .day-cell.today .day-number {
      background: var(--accent);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-cell.selected {
      border-color: var(--accent);
    }

    .day-number {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .day-events {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .day-event-dot {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(168, 85, 247, 0.2);
      color: var(--accent-hover);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-event-more {
      font-size: 9px;
      color: var(--text-muted);
      padding: 0 4px;
    }

    /* Side panel */
    .side-panel {
      width: 280px;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .side-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
    }

    .side-events {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .side-events::-webkit-scrollbar { width: 4px; }
    .side-events::-webkit-scrollbar-track { background: transparent; }
    .side-events::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .event-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      transition: all 0.12s;
    }

    .event-card:hover {
      border-color: var(--accent);
    }

    .event-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .event-meta {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .event-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .event-actions button {
      padding: 3px 8px;
      font-size: 10px;
      font-family: inherit;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.12s;
    }

    .event-actions button:hover {
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .event-actions button.delete:hover {
      color: var(--error);
      border-color: var(--error);
    }

    .no-events {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 380px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea { resize: vertical; min-height: 60px; }

    .form-group input[type="checkbox"] {
      width: auto;
      margin-right: 6px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row .form-group { flex: 1; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-actions button {
      padding: 7px 16px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .modal-actions .cancel-btn {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .modal-actions .cancel-btn:hover {
      background: var(--border);
      color: var(--text-primary);
    }

    .modal-actions .save-btn {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      color: white;
      border: none;
      box-shadow: 0 2px 8px rgba(168, 85, 247, 0.25);
    }

    .modal-actions .save-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.35);
    }

    /* Color-coded input for datetime-local in dark mode */
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>
<body>
  <header>
    <div class="left">
      <h1><span>Calendar</span></h1>
    </div>
    <div class="header-actions">
      <button id="prevBtn">&larr;</button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextBtn">&rarr;</button>
      <button id="todayBtn">Today</button>
      <button class="btn-accent" id="addBtn">+ Event</button>
    </div>
  </header>

  <div class="main">
    <div class="calendar-panel">
      <div class="weekday-row">
        <div class="weekday-cell">Mon</div>
        <div class="weekday-cell">Tue</div>
        <div class="weekday-cell">Wed</div>
        <div class="weekday-cell">Thu</div>
        <div class="weekday-cell">Fri</div>
        <div class="weekday-cell">Sat</div>
        <div class="weekday-cell">Sun</div>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <div class="side-panel">
      <div class="side-header" id="sideHeader">Select a day</div>
      <div class="side-events" id="sideEvents">
        <div class="no-events">Click a day to view events</div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Event Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Add Event</h2>
      <input type="hidden" id="eventId">
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="evTitle" placeholder="Event title" autofocus>
      </div>
      <div class="form-group">
        <label class="checkbox-row"><input type="checkbox" id="evAllDay"> All day</label>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start</label>
          <input type="datetime-local" id="evStart">
        </div>
        <div class="form-group">
          <label>End</label>
          <input type="datetime-local" id="evEnd">
        </div>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="evLocation" placeholder="Optional">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="evDescription" placeholder="Optional"></textarea>
      </div>
      <div class="form-group">
        <label>Reminder (minutes before)</label>
        <input type="number" id="evReminder" value="15" min="0">
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
        <button class="save-btn" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const api = window.pocketAgent || {};
    let currentYear, currentMonth; // 0-indexed month
    let selectedDate = null;
    let events = [];

    function init() {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      selectedDate = toDateStr(now);
      render();
    }

    function toDateStr(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function toLocalISO(d) {
      const off = d.getTimezoneOffset();
      const local = new Date(d.getTime() - off * 60000);
      return local.toISOString().slice(0, 16);
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatDateDisplay(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    }

    async function loadEvents() {
      if (!api.calendarList) return;
      const start = new Date(currentYear, currentMonth - 1, 1).toISOString();
      const end = new Date(currentYear, currentMonth + 2, 0).toISOString();
      try {
        events = await api.calendarList(start, end) || [];
      } catch (e) {
        console.error('Failed to load events:', e);
        events = [];
      }
    }

    function getEventsForDate(dateStr) {
      return events.filter(ev => {
        const evDate = ev.start_time ? ev.start_time.slice(0, 10) : '';
        return evDate === dateStr;
      });
    }

    async function render() {
      await loadEvents();
      renderGrid();
      renderSidePanel();
      document.getElementById('monthLabel').textContent =
        new Date(currentYear, currentMonth).toLocaleDateString([], { month: 'long', year: 'numeric' });
    }

    function renderGrid() {
      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      const firstDay = new Date(currentYear, currentMonth, 1);
      // Monday=0 based
      let startDow = firstDay.getDay() - 1;
      if (startDow < 0) startDow = 6;

      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();

      const todayStr = toDateStr(new Date());
      const cells = [];

      // Previous month padding
      for (let i = startDow - 1; i >= 0; i--) {
        const day = prevMonthDays - i;
        const d = new Date(currentYear, currentMonth - 1, day);
        cells.push({ day, dateStr: toDateStr(d), otherMonth: true });
      }

      // Current month
      for (let d = 1; d <= daysInMonth; d++) {
        const dt = new Date(currentYear, currentMonth, d);
        cells.push({ day: d, dateStr: toDateStr(dt), otherMonth: false });
      }

      // Next month padding to fill 6 rows
      const remaining = 42 - cells.length;
      for (let d = 1; d <= remaining; d++) {
        const dt = new Date(currentYear, currentMonth + 1, d);
        cells.push({ day: d, dateStr: toDateStr(dt), otherMonth: true });
      }

      cells.forEach(cell => {
        const el = document.createElement('div');
        el.className = 'day-cell';
        if (cell.otherMonth) el.classList.add('other-month');
        if (cell.dateStr === todayStr) el.classList.add('today');
        if (cell.dateStr === selectedDate) el.classList.add('selected');

        const num = document.createElement('div');
        num.className = 'day-number';
        num.textContent = cell.day;
        el.appendChild(num);

        const dayEvents = getEventsForDate(cell.dateStr);
        if (dayEvents.length > 0) {
          const evContainer = document.createElement('div');
          evContainer.className = 'day-events';
          const show = dayEvents.slice(0, 2);
          show.forEach(ev => {
            const dot = document.createElement('div');
            dot.className = 'day-event-dot';
            dot.textContent = ev.title;
            evContainer.appendChild(dot);
          });
          if (dayEvents.length > 2) {
            const more = document.createElement('div');
            more.className = 'day-event-more';
            more.textContent = `+${dayEvents.length - 2} more`;
            evContainer.appendChild(more);
          }
          el.appendChild(evContainer);
        }

        el.addEventListener('click', () => {
          selectedDate = cell.dateStr;
          renderGrid();
          renderSidePanel();
        });

        grid.appendChild(el);
      });
    }

    function renderSidePanel() {
      const header = document.getElementById('sideHeader');
      const container = document.getElementById('sideEvents');

      if (!selectedDate) {
        header.textContent = 'Select a day';
        container.innerHTML = '<div class="no-events">Click a day to view events</div>';
        return;
      }

      header.textContent = formatDateDisplay(selectedDate);
      const dayEvents = getEventsForDate(selectedDate);

      if (dayEvents.length === 0) {
        container.innerHTML = '<div class="no-events">No events</div>';
        return;
      }

      container.innerHTML = dayEvents.map(ev => `
        <div class="event-card">
          <div class="event-title">${esc(ev.title)}</div>
          <div class="event-meta">
            ${ev.all_day ? '<span>All day</span>' : `<span>${formatTime(ev.start_time)}${ev.end_time ? ' - ' + formatTime(ev.end_time) : ''}</span>`}
            ${ev.location ? `<span>${esc(ev.location)}</span>` : ''}
            ${ev.description ? `<span>${esc(ev.description)}</span>` : ''}
          </div>
          <div class="event-actions">
            <button onclick="editEvent(${ev.id})">Edit</button>
            <button class="delete" onclick="deleteEvent(${ev.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function esc(s) {
      if (!s) return '';
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // Navigation
    document.getElementById('prevBtn').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      render();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth();
      selectedDate = toDateStr(now);
      render();
    });

    // Modal
    const overlay = document.getElementById('modalOverlay');

    document.getElementById('addBtn').addEventListener('click', () => openModal());
    document.getElementById('cancelBtn').addEventListener('click', () => closeModal());

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    function openModal(event) {
      const isEdit = !!event;
      document.getElementById('modalTitle').textContent = isEdit ? 'Edit Event' : 'Add Event';
      document.getElementById('eventId').value = isEdit ? event.id : '';
      document.getElementById('evTitle').value = isEdit ? event.title : '';
      document.getElementById('evAllDay').checked = isEdit ? event.all_day : false;
      document.getElementById('evLocation').value = isEdit ? (event.location || '') : '';
      document.getElementById('evDescription').value = isEdit ? (event.description || '') : '';
      document.getElementById('evReminder').value = isEdit ? (event.reminder_minutes ?? 15) : 15;

      if (isEdit && event.start_time) {
        document.getElementById('evStart').value = toLocalISO(new Date(event.start_time));
      } else if (selectedDate) {
        document.getElementById('evStart').value = selectedDate + 'T09:00';
      } else {
        document.getElementById('evStart').value = '';
      }

      if (isEdit && event.end_time) {
        document.getElementById('evEnd').value = toLocalISO(new Date(event.end_time));
      } else if (selectedDate) {
        document.getElementById('evEnd').value = selectedDate + 'T10:00';
      } else {
        document.getElementById('evEnd').value = '';
      }

      overlay.classList.add('active');
      document.getElementById('evTitle').focus();
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const title = document.getElementById('evTitle').value.trim();
      if (!title) return;

      const data = {
        title,
        start_time: new Date(document.getElementById('evStart').value).toISOString(),
        end_time: document.getElementById('evEnd').value ? new Date(document.getElementById('evEnd').value).toISOString() : null,
        all_day: document.getElementById('evAllDay').checked ? 1 : 0,
        location: document.getElementById('evLocation').value.trim() || null,
        description: document.getElementById('evDescription').value.trim() || null,
        reminder_minutes: parseInt(document.getElementById('evReminder').value) || 0,
      };

      const id = document.getElementById('eventId').value;
      try {
        if (id) {
          if (api.calendarUpdate) await api.calendarUpdate(parseInt(id), data);
        } else {
          if (api.calendarAdd) await api.calendarAdd(data);
        }
      } catch (e) {
        console.error('Failed to save event:', e);
      }

      closeModal();
      render();
    });

    window.editEvent = function(id) {
      const ev = events.find(e => e.id === id);
      if (ev) openModal(ev);
    };

    window.deleteEvent = async function(id) {
      try {
        if (api.calendarDelete) await api.calendarDelete(id);
      } catch (e) {
        console.error('Failed to delete event:', e);
      }
      render();
    };

    init();
  </script>
</body>
</html>
