<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;">
  <title>Content Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #141415;
      --bg-tertiary: #1c1c1e;
      --border: #2a2a2d;
      --text-primary: #fafafa;
      --text-secondary: #a1a1a6;
      --text-muted: #636366;
      --accent: #a855f7;
      --accent-secondary: #ec4899;
      --accent-hover: #c084fc;
      --error: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

    header h1 span {
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-stats {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .btn:hover { background: var(--border); color: var(--text-primary); }
    .btn-accent { background: rgba(168,85,247,0.15); color: #c084fc; border-color: rgba(168,85,247,0.3); }
    .btn-accent:hover { background: rgba(168,85,247,0.25); }
    .btn-success { background: rgba(34,197,94,0.12); color: #4ade80; border-color: rgba(34,197,94,0.25); }
    .btn-danger { background: rgba(239,68,68,0.12); color: #f87171; border-color: rgba(239,68,68,0.25); }
    .btn-blue { background: rgba(96,165,250,0.1); color: #60a5fa; border-color: rgba(96,165,250,0.28); }
    .btn-sm { padding: 3px 10px; font-size: 12px; }

    /* Main layout */
    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar filters */
    .sidebar {
      width: 180px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .filter-group { margin-bottom: 16px; }
    .filter-group-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-secondary);
      transition: background 0.1s;
    }
    .filter-item:hover { background: var(--bg-tertiary); }
    .filter-item.active { color: var(--text-primary); background: var(--bg-tertiary); }
    .filter-item input[type="checkbox"] { accent-color: var(--accent); }
    .filter-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Content area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    /* Selection bar */
    .selection-bar {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }
    .selection-bar.visible { display: flex; }
    .sel-count { font-size: 12px; color: var(--text-muted); margin-right: 8px; }

    /* Asset table */
    .asset-table {
      width: 100%;
      border-collapse: collapse;
    }

    .asset-table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .asset-table td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(42,42,45,0.5);
      vertical-align: top;
    }

    .asset-row { cursor: pointer; transition: background 0.1s; }
    .asset-row:hover { background: rgba(255,255,255,0.02); }
    .asset-row.selected { background: rgba(168,85,247,0.08); }

    .asset-row .cb { width: 16px; }
    .asset-row input[type="checkbox"] { accent-color: var(--accent); }

    .target-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .target-badge.profile { background: rgba(34,197,94,0.12); color: #4ade80; }
    .target-badge.company { background: rgba(96,165,250,0.12); color: #93c5fd; }
    .target-badge.group { background: rgba(251,191,36,0.12); color: #fcd34d; }
    .target-badge.article { background: rgba(168,85,247,0.12); color: #c084fc; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-badge.pending { color: var(--text-muted); }
    .status-badge.drafted { color: #60a5fa; }
    .status-badge.approved { color: #a78bfa; }
    .status-badge.scheduled { color: #fbbf24; }
    .status-badge.published { color: #4ade80; }
    .status-badge.rejected { color: #f87171; }
    .status-badge.copied { color: #94a3b8; }

    .plan-tag {
      font-size: 11px;
      color: var(--text-muted);
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .content-preview {
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
    }

    /* Expanded row detail */
    .asset-detail {
      display: none;
      padding: 12px 16px;
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border);
    }
    .asset-detail.visible { display: block; }
    .asset-detail-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding: 10px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .asset-detail-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Side panel (new plan / target management) */
    .side-panel {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    }
    .side-panel.open { right: 0; }
    .side-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .side-panel-title {
      font-size: 14px;
      font-weight: 600;
    }
    .side-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
    }
    .form-textarea { resize: vertical; min-height: 80px; }

    .mode-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .mode-toggle button {
      flex: 1;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: none;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.1s;
    }
    .mode-toggle button.active {
      background: rgba(168,85,247,0.2);
      color: #c084fc;
    }

    .target-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .target-check input[type="checkbox"] { accent-color: var(--accent); }
    .target-check .qty {
      margin-left: auto;
      width: 50px;
      padding: 3px 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      font-family: inherit;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      color: var(--text-muted);
      font-size: 14px;
      gap: 12px;
    }

    /* Target management list */
    .target-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      background: var(--bg-tertiary);
    }
    .target-item .target-info { flex: 1; }
    .target-item .target-name { font-size: 13px; font-weight: 500; }
    .target-item .target-meta { font-size: 11px; color: var(--text-muted); }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
      display: none;
    }
    .overlay.visible { display: block; }
  </style>
</head>
<body>
  <header>
    <h1><span>Content Planner</span></h1>
    <span class="header-stats" id="header-stats"></span>
    <div class="header-actions">
      <button class="btn btn-blue" onclick="openTargetPanel()">Targets</button>
      <button class="btn btn-accent" onclick="openNewPlanPanel()">+ New Plan</button>
    </div>
  </header>

  <div class="selection-bar" id="selection-bar">
    <span class="sel-count" id="sel-count">0 selected</span>
    <button class="btn btn-success btn-sm" onclick="approveSelected()">Approve</button>
    <button class="btn btn-sm" onclick="scheduleSelected()">Schedule</button>
    <button class="btn btn-danger btn-sm" onclick="rejectSelected()">Reject</button>
    <button class="btn btn-sm" onclick="copySelected()">Copy Text</button>
  </div>

  <div class="main-layout">
    <div class="sidebar" id="sidebar">
      <div class="filter-group">
        <div class="filter-group-title">Status</div>
        <div id="status-filters"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">Target</div>
        <div id="target-filters"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">Plan</div>
        <div id="plan-filters"></div>
      </div>
    </div>

    <div class="content" id="content">
      <table class="asset-table">
        <thead>
          <tr>
            <th style="width:30px"><input type="checkbox" id="select-all" onchange="toggleSelectAll()"></th>
            <th>Target</th>
            <th>Content</th>
            <th>Plan</th>
            <th>Status</th>
            <th>When</th>
          </tr>
        </thead>
        <tbody id="asset-body"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none">
        <div>No content assets yet</div>
        <button class="btn btn-accent" onclick="openNewPlanPanel()">Create your first plan</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="closePanels()"></div>

  <!-- New Plan side panel -->
  <div class="side-panel" id="new-plan-panel">
    <div class="side-panel-header">
      <span class="side-panel-title">New Plan</span>
      <button class="btn btn-sm" onclick="closePanels()">&times;</button>
    </div>
    <div class="side-panel-body">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-input" id="plan-title" placeholder="Short plan title...">
      </div>
      <div class="form-group">
        <label class="form-label">Prompt</label>
        <textarea class="form-textarea" id="plan-prompt" placeholder="What should we write about?" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Reference URLs (one per line)</label>
        <textarea class="form-textarea" id="plan-urls" placeholder="https://..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Research Mode</label>
        <div class="mode-toggle" id="research-mode">
          <button onclick="setResearchMode('fast')">Fast</button>
          <button class="active" onclick="setResearchMode('balanced')">Balanced</button>
          <button onclick="setResearchMode('deep')">Deep</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Targets</label>
        <div id="plan-targets"></div>
      </div>
      <button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="createPlan()">Create & Research</button>
    </div>
  </div>

  <!-- Target management side panel -->
  <div class="side-panel" id="target-panel">
    <div class="side-panel-header">
      <span class="side-panel-title">Manage Targets</span>
      <button class="btn btn-sm" onclick="closePanels()">&times;</button>
    </div>
    <div class="side-panel-body">
      <div id="target-list"></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        <div class="form-group">
          <label class="form-label">Add Target</label>
          <div style="display:flex;gap:6px;margin-bottom:6px">
            <select class="form-select" id="new-target-type" style="width:120px">
              <option value="profile">Profile</option>
              <option value="company">Company</option>
              <option value="group">Group</option>
              <option value="article">Article</option>
            </select>
            <input class="form-input" id="new-target-label" placeholder="Label..." style="flex:1">
          </div>
          <input class="form-input" id="new-target-url" placeholder="LinkedIn URL (optional)" style="margin-bottom:6px">
          <input class="form-input" id="new-target-audience" placeholder="Audience summary (optional)">
        </div>
        <button class="btn btn-accent btn-sm" onclick="addTarget()">Add Target</button>
      </div>
    </div>
  </div>

<script>
  const api = window.pocketAgent;

  // State
  let allAssets = [];
  let allTargets = [];
  let allPlans = [];
  let selectedIds = new Set();
  let expandedId = null;
  let statusFilter = null; // null = all
  let targetFilters = new Set(); // empty = all
  let planFilters = new Set(); // empty = all
  let researchMode = 'balanced';

  // Icons
  const TARGET_ICONS = { profile: '\u{1F9D1}', company: '\u{1F3E2}', group: '\u{1F465}', article: '\u{1F4C4}' };
  const STATUS_ICONS = { pending: '\u23F3', drafted: '\u{1F4DD}', approved: '\u2705', scheduled: '\u23F0', published: '\u2705', rejected: '\u274C', copied: '\u{1F4CB}' };

  // ---- Load data ----
  async function loadAll() {
    [allTargets, allPlans, allAssets] = await Promise.all([
      api.plannerListTargets(),
      api.plannerListPlans(),
      api.plannerListAssets(),
    ]);
    renderFilters();
    renderAssets();
    updateStats();
  }

  function updateStats() {
    const byStatus = {};
    for (const a of allAssets) byStatus[a.status] = (byStatus[a.status] || 0) + 1;
    const parts = [];
    if (byStatus.published) parts.push(`${byStatus.published} published`);
    if (byStatus.drafted) parts.push(`${byStatus.drafted} draft`);
    if (byStatus.approved) parts.push(`${byStatus.approved} approved`);
    if (byStatus.scheduled) parts.push(`${byStatus.scheduled} scheduled`);
    if (byStatus.pending) parts.push(`${byStatus.pending} pending`);
    document.getElementById('header-stats').textContent = parts.length ? parts.join(' \u00B7 ') : 'No assets';
  }

  // ---- Filters ----
  function renderFilters() {
    // Status
    const statuses = ['pending', 'drafted', 'approved', 'scheduled', 'published', 'rejected', 'copied'];
    const statusCounts = {};
    for (const a of allAssets) statusCounts[a.status] = (statusCounts[a.status] || 0) + 1;
    let html = `<div class="filter-item ${!statusFilter ? 'active' : ''}" onclick="setStatusFilter(null)">All <span class="filter-count">${allAssets.length}</span></div>`;
    for (const s of statuses) {
      if (!statusCounts[s]) continue;
      html += `<div class="filter-item ${statusFilter === s ? 'active' : ''}" onclick="setStatusFilter('${s}')">${s.charAt(0).toUpperCase() + s.slice(1)} <span class="filter-count">${statusCounts[s]}</span></div>`;
    }
    document.getElementById('status-filters').innerHTML = html;

    // Targets
    let thtml = '';
    for (const t of allTargets) {
      const count = allAssets.filter(a => a.target_id === t.id).length;
      const checked = targetFilters.size === 0 || targetFilters.has(t.id);
      thtml += `<div class="filter-item"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleTargetFilter(${t.id})"> ${TARGET_ICONS[t.target_type] || ''} ${t.label} <span class="filter-count">${count}</span></div>`;
    }
    document.getElementById('target-filters').innerHTML = thtml || '<div style="font-size:11px;color:var(--text-muted)">No targets</div>';

    // Plans
    let phtml = '';
    for (const p of allPlans) {
      const count = allAssets.filter(a => a.plan_id === p.id).length;
      const checked = planFilters.size === 0 || planFilters.has(p.id);
      phtml += `<div class="filter-item"><input type="checkbox" ${checked ? 'checked' : ''} onchange="togglePlanFilter(${p.id})"> ${p.title.slice(0, 20)} <span class="filter-count">${count}</span></div>`;
    }
    document.getElementById('plan-filters').innerHTML = phtml || '<div style="font-size:11px;color:var(--text-muted)">No plans</div>';
  }

  function setStatusFilter(status) {
    statusFilter = status;
    renderFilters();
    renderAssets();
  }

  function toggleTargetFilter(id) {
    if (targetFilters.has(id)) targetFilters.delete(id);
    else targetFilters.add(id);
    renderAssets();
  }

  function togglePlanFilter(id) {
    if (planFilters.has(id)) planFilters.delete(id);
    else planFilters.add(id);
    renderAssets();
  }

  // ---- Render assets ----
  function getFilteredAssets() {
    return allAssets.filter(a => {
      if (statusFilter && a.status !== statusFilter) return false;
      if (targetFilters.size > 0 && !targetFilters.has(a.target_id)) return false;
      if (planFilters.size > 0 && !planFilters.has(a.plan_id)) return false;
      return true;
    });
  }

  function renderAssets() {
    const filtered = getFilteredAssets();
    const tbody = document.getElementById('asset-body');
    const empty = document.getElementById('empty-state');

    if (filtered.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    let html = '';
    for (const a of filtered) {
      const sel = selectedIds.has(a.id);
      const icon = TARGET_ICONS[a.target_type] || '';
      const preview = (a.draft_text || a.final_text || '').slice(0, 80);
      const when = a.published_at ? formatTime(a.published_at) : a.scheduled_at ? formatTime(a.scheduled_at) : '\u2014';

      html += `<tr class="asset-row ${sel ? 'selected' : ''}" data-id="${a.id}">
        <td class="cb"><input type="checkbox" ${sel ? 'checked' : ''} onchange="toggleSelect(${a.id}, event)"></td>
        <td><span class="target-badge ${a.target_type}">${icon} ${a.target_label || a.target_type}</span></td>
        <td class="content-preview" onclick="toggleExpand(${a.id})">${escHtml(preview) || '<em style="color:var(--text-muted)">pending</em>'}</td>
        <td><span class="plan-tag" title="${escHtml(a.plan_title || '')}">${escHtml((a.plan_title || '').slice(0, 20))}</span></td>
        <td><span class="status-badge ${a.status}">${STATUS_ICONS[a.status] || ''} ${a.status}</span></td>
        <td style="font-size:12px;color:var(--text-muted);white-space:nowrap">${when}</td>
      </tr>`;

      // Expandable detail row
      html += `<tr id="detail-${a.id}" style="display:${expandedId === a.id ? 'table-row' : 'none'}">
        <td colspan="6" style="padding:0">
          <div class="asset-detail ${expandedId === a.id ? 'visible' : ''}">
            <div class="asset-detail-text">${escHtml(a.final_text || a.draft_text || 'No content yet')}</div>
            <div class="asset-detail-actions">
              ${a.status === 'drafted' ? `<button class="btn btn-success btn-sm" onclick="approveOne(${a.id})">Approve</button>` : ''}
              ${a.status === 'approved' ? `<button class="btn btn-sm" onclick="scheduleOne(${a.id})">Schedule</button>` : ''}
              ${a.status === 'approved' && a.can_auto_publish ? `<button class="btn btn-success btn-sm" onclick="publishOne(${a.id})">Publish Now</button>` : ''}
              ${!a.can_auto_publish && (a.status === 'approved' || a.status === 'drafted') ? `<button class="btn btn-sm" onclick="copyOne(${a.id})">Copy Text</button>` : ''}
              ${a.status !== 'published' && a.status !== 'rejected' ? `<button class="btn btn-danger btn-sm" onclick="rejectOne(${a.id})">Reject</button>` : ''}
            </div>
          </div>
        </td>
      </tr>`;
    }
    tbody.innerHTML = html;
    updateSelectionBar();
  }

  function toggleExpand(id) {
    expandedId = expandedId === id ? null : id;
    renderAssets();
  }

  // ---- Selection ----
  function toggleSelect(id, event) {
    event && event.stopPropagation();
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderAssets();
  }

  function toggleSelectAll() {
    const filtered = getFilteredAssets();
    if (selectedIds.size === filtered.length) {
      selectedIds.clear();
    } else {
      for (const a of filtered) selectedIds.add(a.id);
    }
    renderAssets();
  }

  function updateSelectionBar() {
    const bar = document.getElementById('selection-bar');
    if (selectedIds.size > 0) {
      bar.classList.add('visible');
      document.getElementById('sel-count').textContent = `${selectedIds.size} selected`;
    } else {
      bar.classList.remove('visible');
    }
  }

  // ---- Actions ----
  async function approveOne(id) {
    await api.plannerApproveAsset(id);
    await loadAll();
  }

  async function rejectOne(id) {
    await api.plannerRejectAsset(id);
    await loadAll();
  }

  async function scheduleOne(id) {
    const when = new Date(Date.now() + 3600000).toISOString();
    await api.plannerScheduleAssets([id], when);
    await loadAll();
  }

  async function publishOne(id) {
    const result = await api.plannerPublishAsset(id);
    if (result && result.error) alert('Publish failed: ' + result.error);
    await loadAll();
  }

  async function copyOne(id) {
    const asset = allAssets.find(a => a.id === id);
    if (!asset) return;
    const text = asset.final_text || asset.draft_text || '';
    await navigator.clipboard.writeText(text);
    await api.plannerMarkCopied(id);
    await loadAll();
  }

  async function approveSelected() {
    for (const id of selectedIds) await api.plannerApproveAsset(id);
    selectedIds.clear();
    await loadAll();
  }

  async function rejectSelected() {
    for (const id of selectedIds) await api.plannerRejectAsset(id);
    selectedIds.clear();
    await loadAll();
  }

  async function scheduleSelected() {
    const when = new Date(Date.now() + 3600000).toISOString();
    await api.plannerScheduleAssets([...selectedIds], when);
    selectedIds.clear();
    await loadAll();
  }

  async function copySelected() {
    const texts = [];
    for (const id of selectedIds) {
      const a = allAssets.find(a => a.id === id);
      if (a) texts.push(a.final_text || a.draft_text || '');
    }
    await navigator.clipboard.writeText(texts.join('\n\n---\n\n'));
    for (const id of selectedIds) await api.plannerMarkCopied(id);
    selectedIds.clear();
    await loadAll();
  }

  // ---- Panels ----
  function openNewPlanPanel() {
    closePanels();
    renderPlanTargets();
    document.getElementById('overlay').classList.add('visible');
    document.getElementById('new-plan-panel').classList.add('open');
  }

  function openTargetPanel() {
    closePanels();
    renderTargetList();
    document.getElementById('overlay').classList.add('visible');
    document.getElementById('target-panel').classList.add('open');
  }

  function closePanels() {
    document.getElementById('overlay').classList.remove('visible');
    document.getElementById('new-plan-panel').classList.remove('open');
    document.getElementById('target-panel').classList.remove('open');
  }

  function setResearchMode(mode) {
    researchMode = mode;
    document.querySelectorAll('#research-mode button').forEach(b => {
      b.classList.toggle('active', b.textContent.trim().toLowerCase() === mode);
    });
  }

  function renderPlanTargets() {
    const container = document.getElementById('plan-targets');
    if (allTargets.length === 0) {
      container.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">No targets configured. <a href="#" onclick="openTargetPanel()" style="color:var(--accent)">Add targets first.</a></div>';
      return;
    }
    container.innerHTML = allTargets.filter(t => t.enabled).map(t => `
      <div class="target-check">
        <input type="checkbox" id="pt-${t.id}" checked>
        <span>${TARGET_ICONS[t.target_type] || ''} ${t.label}</span>
        <input type="number" class="qty" id="qty-${t.id}" value="${t.posts_per_day}" min="1" max="10">
      </div>
    `).join('');
  }

  async function createPlan() {
    const title = document.getElementById('plan-title').value.trim();
    const prompt = document.getElementById('plan-prompt').value.trim();
    if (!title || !prompt) { alert('Title and prompt are required'); return; }

    const urls = document.getElementById('plan-urls').value.trim().split('\n').map(u => u.trim()).filter(Boolean);
    const targetIds = [];
    const postsPerTarget = {};
    for (const t of allTargets) {
      const cb = document.getElementById('pt-' + t.id);
      if (cb && cb.checked) {
        targetIds.push(t.id);
        const qty = document.getElementById('qty-' + t.id);
        if (qty) postsPerTarget[t.id] = parseInt(qty.value) || 1;
      }
    }
    if (targetIds.length === 0) { alert('Select at least one target'); return; }

    closePanels();
    document.getElementById('header-stats').textContent = 'Creating plan...';

    const plan = await api.plannerCreatePlan({
      title,
      prompt,
      source_urls: urls.length > 0 ? urls : undefined,
      research_mode: researchMode,
      target_ids: targetIds,
      posts_per_target: postsPerTarget,
    });

    // Clear form
    document.getElementById('plan-title').value = '';
    document.getElementById('plan-prompt').value = '';
    document.getElementById('plan-urls').value = '';

    await loadAll();

    // Auto-generate drafts
    if (plan && plan.id) {
      document.getElementById('header-stats').textContent = 'Generating drafts...';
      await api.plannerGenerateAssets(plan.id);
      await loadAll();
    }
  }

  // ---- Target management ----
  function renderTargetList() {
    const container = document.getElementById('target-list');
    if (allTargets.length === 0) {
      container.innerHTML = '<div style="font-size:12px;color:var(--text-muted);padding:8px 0">No targets configured yet.</div>';
      return;
    }
    container.innerHTML = allTargets.map(t => `
      <div class="target-item">
        <span>${TARGET_ICONS[t.target_type] || ''}</span>
        <div class="target-info">
          <div class="target-name">${escHtml(t.label)}</div>
          <div class="target-meta">${t.target_type} ${t.url ? '\u00B7 ' + t.url.slice(0, 40) : ''} \u00B7 ${t.posts_per_day}/day \u00B7 ${t.approval_mode}${t.can_auto_publish ? ' \u00B7 auto-pub' : ''}</div>
        </div>
        <button class="btn btn-sm" onclick="toggleTargetEnabled(${t.id}, ${t.enabled ? 'false' : 'true'})">${t.enabled ? 'Disable' : 'Enable'}</button>
        <button class="btn btn-danger btn-sm" onclick="removeTarget(${t.id})">Del</button>
      </div>
    `).join('');
  }

  async function addTarget() {
    const targetType = document.getElementById('new-target-type').value;
    const label = document.getElementById('new-target-label').value.trim();
    if (!label) { alert('Label is required'); return; }
    const url = document.getElementById('new-target-url').value.trim() || undefined;
    const audience = document.getElementById('new-target-audience').value.trim() || undefined;

    await api.plannerAddTarget({ target_type: targetType, label, url, audience_summary: audience });
    document.getElementById('new-target-label').value = '';
    document.getElementById('new-target-url').value = '';
    document.getElementById('new-target-audience').value = '';
    allTargets = await api.plannerListTargets();
    renderTargetList();
    renderFilters();
  }

  async function removeTarget(id) {
    const result = await api.plannerDeleteTarget(id);
    if (result && !result.success) { alert(result.error || 'Cannot delete'); return; }
    allTargets = await api.plannerListTargets();
    renderTargetList();
    renderFilters();
  }

  async function toggleTargetEnabled(id, enabled) {
    await api.plannerToggleTarget(id, enabled);
    allTargets = await api.plannerListTargets();
    renderTargetList();
    renderFilters();
  }

  // ---- Helpers ----
  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function formatTime(isoStr) {
    if (!isoStr) return '';
    try {
      const d = new Date(isoStr);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    } catch { return isoStr; }
  }

  // ---- Init ----
  loadAll();
</script>
</body>
</html>
