<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: file: atom: https:; media-src 'self' blob: file:;">
  <title>Pocket Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #141415;
      --bg-tertiary: #1c1c1e;
      --border: #2a2a2d;
      --text-primary: #fafafa;
      --text-secondary: #a1a1a6;
      --text-muted: #636366;
      --accent: #a855f7;
      --accent-secondary: #ec4899;
      --accent-hover: #c084fc;
      --user-bubble: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      --user-bubble-solid: #a855f7;
      --assistant-bubble: #1c1c1e;
      --error: #ef4444;
      --success: #22c55e;
      --radius: 20px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      position: relative;
    }

    /* Session Tabs */
    .tabs-container {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      gap: 4px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tabs-container::-webkit-scrollbar {
      height: 0;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-bottom: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: grab;
      border-radius: 8px 8px 0 0;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      max-width: 180px;
      position: relative;
      user-select: none;
      margin-bottom: -1px;
    }

    .tab:hover {
      color: var(--text-primary);
      background: var(--bg-secondary);
      border-color: var(--text-muted);
    }

    .tab.active {
      color: var(--text-primary);
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-bottom: 1px solid var(--bg-primary);
    }

    .tab.dragging {
      opacity: 0.6;
      cursor: grabbing;
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .tab.dragging .tab-close {
      color: rgba(255,255,255,0.7);
    }

    .tab.loading .tab-name {
      background: linear-gradient(
        90deg,
        var(--text-primary) 0%,
        var(--text-primary) 40%,
        #60a5fa 50%,
        var(--text-primary) 60%,
        var(--text-primary) 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: tab-text-shimmer 1.5s ease-in-out infinite;
    }

    @keyframes tab-text-shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .tab-name-input {
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      padding: 2px 6px;
      width: 100px;
      outline: none;
    }

    .tab-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      line-height: 1;
      font-size: 14px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .tab-close:hover {
      background: var(--error);
      color: white;
    }

    .tab-telegram-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0088cc;
      flex-shrink: 0;
      margin-left: 2px;
    }

    .tab-telegram-icon svg {
      width: 12px;
      height: 12px;
    }

    .new-tab-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      transition: all 0.15s ease;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .new-tab-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.9); }
    }

    header h1 {
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version-badge {
      font-size: 9px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      letter-spacing: 0;
      -webkit-text-fill-color: var(--text-muted);
    }

    .model-badge {
      font-size: 9px;
      font-weight: 600;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      padding: 2px 8px;
      border-radius: 4px;
      margin-left: 8px;
      letter-spacing: 0;
      -webkit-text-fill-color: #22c55e;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stats {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Hamburger Menu */
    .hamburger-menu {
      position: relative;
    }

    .hamburger-btn {
      width: 28px;
      height: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .hamburger-btn:hover {
      background: var(--border);
      transform: scale(1.05);
    }

    .hamburger-btn span {
      display: block;
      width: 14px;
      height: 2px;
      background: var(--text-secondary);
      border-radius: 1px;
      transition: all 0.2s ease;
    }

    .hamburger-btn:hover span {
      background: var(--text-primary);
    }

    .hamburger-btn.active span:nth-child(1) {
      transform: rotate(45deg) translate(4px, 4px);
    }

    .hamburger-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger-btn.active span:nth-child(3) {
      transform: rotate(-45deg) translate(4px, -4px);
    }

    .menu-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 180px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 200;
      overflow: hidden;
    }

    .menu-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .menu-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .menu-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .menu-item.danger:hover {
      color: var(--error);
    }

    .menu-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Messages Container */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    #messages::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Message Bubbles */
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
      animation: messageIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: bottom;
    }

    @keyframes messageIn {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.92);
      }
      50% {
        transform: translateY(-4px) scale(1.02);
      }
      75% {
        transform: translateY(2px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .message.user:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
      color: var(--text-primary);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .message.assistant:hover {
      transform: translateY(-1px);
      border-color: var(--text-muted);
    }

    .message.system {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      padding: 8px 16px;
    }

    .telegram-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #0088cc;
      margin-bottom: 6px;
      font-weight: 500;
      opacity: 0.9;
    }

    .telegram-header svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
    }

    /* Queued message state - greyed out until processing */
    .message.queued {
      opacity: 0.5;
      filter: grayscale(30%);
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .message.queued::after {
      content: 'queued';
      position: absolute;
      top: -8px;
      right: 8px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .message.user.queued {
      position: relative;
      box-shadow: none;
    }

    .message.user.queued:hover {
      transform: none;
      box-shadow: none;
    }

    /* Scheduled task badge */
    .message.scheduled {
      position: relative;
    }

    .message.scheduled::after {
      content: attr(data-badge);
      position: absolute;
      top: -8px;
      left: 8px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--accent);
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--accent);
    }

    /* Telegram message badge */
    .message.from-telegram {
      position: relative;
    }

    .message.from-telegram .telegram-badge {
      position: absolute;
      top: -8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #229ED9;
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #229ED9;
    }

    .message.from-telegram .telegram-badge svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
    }

    /* Voice message badge */
    .message.from-voice {
      position: relative;
    }

    .message.from-voice .voice-badge {
      position: absolute;
      top: -8px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #ef4444;
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #ef4444;
    }

    .message.from-voice .voice-badge svg {
      width: 10px;
      height: 10px;
    }

    /* Workflow badge */
    .message.from-workflow {
      position: relative;
    }

    .message.from-workflow::after {
      content: 'workflow';
      position: absolute;
      top: -8px;
      left: 8px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #ffffff;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Queue indicator in status */
    .queue-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 8px;
      background: var(--bg-tertiary);
      border-radius: 4px;
      margin-top: 4px;
    }

    .queue-indicator .queue-count {
      background: var(--accent);
      color: white;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 10px;
    }

    /* Code blocks in messages */
    .message code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
    }

    .message pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      margin: 8px 0;
    }

    .message pre code {
      background: none;
      padding: 0;
    }

    /* Markdown elements - tight spacing for chat */
    .message h1, .message h2, .message h3, .message h4 {
      margin: 1em 0 0.4em 0;
      font-weight: 600;
      line-height: 1.3;
    }

    .message h1:first-child, .message h2:first-child,
    .message h3:first-child, .message h4:first-child {
      margin-top: 0;
    }

    .message h1 { font-size: 1.2em; }
    .message h2 { font-size: 1.1em; }
    .message h3 { font-size: 1.05em; }
    .message h4 { font-size: 1em; }

    .message p {
      margin: 0;
    }

    .message p + p {
      margin-top: 0.5em;
    }

    .message > *:last-child {
      margin-bottom: 0 !important;
    }

    .message > *:first-child {
      margin-top: 0 !important;
    }

    .message ul, .message ol {
      margin: 0.3em 0;
      padding-left: 1.4em;
    }

    .message ul:first-child, .message ol:first-child { margin-top: 0; }
    .message ul:last-child, .message ol:last-child { margin-bottom: 0; }

    .message li {
      margin: 0;
      padding: 0;
      line-height: 1.5;
    }

    .message li + li {
      margin-top: 0.1em;
    }

    .message li p,
    .message li > p,
    .message li p:first-child,
    .message li p:last-child {
      margin: 0;
      padding: 0;
      display: inline;
    }

    .message a {
      color: #60a5fa;
      text-decoration: underline;
      text-decoration-color: rgba(96, 165, 250, 0.4);
      text-underline-offset: 2px;
    }

    .message a:hover {
      color: #93c5fd;
      text-decoration-color: rgba(147, 197, 253, 0.6);
    }

    .message.user a {
      color: #bfdbfe;
      text-decoration-color: rgba(191, 219, 254, 0.4);
    }

    .message.user a:hover {
      color: #ffffff;
      text-decoration-color: rgba(255, 255, 255, 0.6);
    }

    .message a.file-link {
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: none;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.85em;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      word-break: break-all;
    }

    .message a.file-link:hover {
      color: #c4b5fd;
      background: rgba(167, 139, 250, 0.2);
      text-decoration: none;
    }

    .message a.file-link::before {
      content: '📄 ';
      font-size: 0.9em;
    }

    .inline-screenshot {
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-screenshot {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: opacity 0.15s;
      object-fit: contain;
    }

    .chat-screenshot:hover {
      opacity: 0.9;
    }

    .screenshot-link::before {
      content: '🖼 ' !important;
    }

    .message hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.6em 0;
    }

    .message blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 0.8em;
      margin: 0.4em 0;
      color: var(--text-secondary);
    }

    .message .table-wrapper {
      overflow-x: auto;
      margin: 0.5em 0;
      max-width: 100%;
    }

    .message table {
      border-collapse: collapse;
      min-width: 100%;
      white-space: nowrap;
      font-size: 0.95em;
    }

    .message th, .message td {
      border: 1px solid var(--border);
      padding: 0.4em 0.6em;
      text-align: left;
    }

    .message th {
      background: var(--bg-tertiary);
    }

    .message strong { font-weight: 600; }
    .message em { font-style: italic; }

    /* Status Indicator */
    .status-indicator {
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: messageIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 80%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    .status-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(168, 85, 247, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .status-action {
      font-size: 13px;
      font-weight: 500;
      background: linear-gradient(
        90deg,
        var(--text-primary) 0%,
        var(--accent) 20%,
        var(--accent-secondary) 40%,
        var(--accent) 60%,
        var(--text-primary) 80%,
        var(--accent) 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    /* Subagent active state - purple/pink vibe */
    .status-indicator.subagent-active {
      border-color: #a855f7;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
    }

    .status-indicator.subagent-active .status-spinner {
      border-color: rgba(168, 85, 247, 0.3);
      border-top-color: #a855f7;
    }

    .status-indicator.subagent-active .status-action {
      background: linear-gradient(
        90deg,
        #a855f7 0%,
        #ec4899 25%,
        #a855f7 50%,
        #ec4899 75%,
        #a855f7 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    /* Tool blocked state - red/orange warning vibe */
    .status-indicator.tool-blocked {
      border-color: #ef4444;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(249, 115, 22, 0.15) 100%);
      animation: blocked-pulse 0.5s ease-in-out 2;
    }

    .status-indicator.tool-blocked .status-action {
      background: linear-gradient(
        90deg,
        #ef4444 0%,
        #f97316 50%,
        #ef4444 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 1s ease-in-out infinite;
    }

    .status-indicator.tool-blocked .status-detail {
      color: #f97316;
    }

    @keyframes blocked-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Pocket CLI active state - green/cyan vibe */
    .status-indicator.pocket-cli-active {
      border-color: #22c55e;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(103, 232, 249, 0.1) 100%);
    }

    .status-indicator.pocket-cli-active .status-action {
      background: linear-gradient(
        90deg,
        #22c55e 0%,
        #67e8f9 25%,
        #22c55e 50%,
        #67e8f9 75%,
        #22c55e 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    .status-indicator.pocket-cli-active .status-detail {
      color: #22c55e;
    }

    /* Agent Teams active state - blue/cyan vibe */
    .status-indicator.team-active {
      border-color: #3b82f6;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(6, 182, 212, 0.1) 100%);
    }

    .status-indicator.team-active .status-action {
      background: linear-gradient(
        90deg,
        #3b82f6 0%,
        #06b6d4 25%,
        #3b82f6 50%,
        #06b6d4 75%,
        #3b82f6 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    .status-indicator.team-active .status-detail {
      color: #06b6d4;
    }

    .status-detail {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }

    /* Simple typing dots fallback */
    .typing {
      align-self: flex-start;
      padding: 14px 18px;
      background: var(--assistant-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 6px;
      display: flex;
      gap: 6px;
      animation: messageIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: typingBounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; background: var(--accent); }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%); }
    .typing-dot:nth-child(3) { animation-delay: 0s; background: var(--accent-secondary); }

    @keyframes typingBounce {
      0%, 80%, 100% {
        transform: scale(0.7) translateY(0);
        opacity: 0.4;
      }
      40% {
        transform: scale(1.1) translateY(-4px);
        opacity: 1;
      }
    }

    /* Scroll buttons */
    .scroll-btn {
      position: fixed;
      right: 24px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      pointer-events: none;
    }

    .scroll-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .scroll-btn:hover {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    /* Input Area */
    #input-area {
      padding: 16px 20px 20px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .input-container {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-container:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15), 0 0 20px rgba(168, 85, 247, 0.1);
    }

    .attach-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .attach-btn:hover {
      background: var(--border);
      color: var(--accent);
      transform: scale(1.1) rotate(-10deg);
    }

    .attach-btn:active {
      transform: scale(0.95) rotate(0deg);
    }

    .attach-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Voice recording button */
    .voice-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }

    .voice-btn:hover {
      background: var(--border);
      color: var(--accent);
      transform: scale(1.1);
    }

    .voice-btn.recording {
      color: #ef4444;
      animation: recording-pulse 1.5s ease-in-out infinite;
    }

    @keyframes recording-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.7; }
    }

    .voice-btn svg {
      width: 18px;
      height: 18px;
    }

    /* TTS play button on assistant messages */
    .tts-play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      opacity: 0;
      transition: all 0.2s ease;
      margin-left: 4px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .message.assistant:hover .tts-play-btn {
      opacity: 1;
    }

    .tts-play-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .tts-play-btn.playing {
      color: var(--error);
      opacity: 1;
      border-color: var(--error);
    }

    .tts-play-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Auto-TTS toggle in header */
    .tts-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 11px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .tts-toggle:hover {
      background: var(--border);
    }

    .tts-toggle.active {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    .tts-toggle svg {
      width: 14px;
      height: 14px;
    }

    #message-input {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 24px;
      max-height: 150px;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    #message-input::placeholder {
      color: var(--text-muted);
    }

    #message-input.has-suggestion::placeholder {
      color: transparent;
    }

    .textarea-wrapper {
      position: relative;
      flex: 1;
      display: flex;
    }

    #ghost-suggestion {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      line-height: 1.5;
      color: var(--text-muted);
      pointer-events: none;
      white-space: pre-wrap;
      word-wrap: break-word;
      opacity: 0.6;
    }

    #ghost-suggestion .tab-hint {
      color: var(--accent);
      opacity: 0.7;
      font-size: 12px;
      margin-left: 8px;
    }

    #send-btn {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    #send-btn:hover:not(:disabled) {
      transform: scale(1.08) rotate(-3deg);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45);
    }

    #send-btn:active:not(:disabled) {
      transform: scale(0.95) rotate(0deg);
    }

    #send-btn:disabled {
      background: var(--bg-tertiary);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }

    #send-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s ease;
    }

    #send-btn:hover:not(:disabled) svg {
      transform: translateX(2px) translateY(-2px);
    }

    #send-btn.stop-btn {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    #send-btn.stop-btn:hover {
      background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
      transform: scale(1.08);
    }

    /* Search Area */
    #search-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      min-height: 30px;
    }

    .search-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      height: 30px;
      box-sizing: border-box;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .search-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    .search-toggle svg {
      width: 14px;
      height: 14px;
    }

    #search-area.searching .search-toggle {
      display: none;
    }

    #search-expanded {
      display: none;
      align-items: center;
      gap: 8px;
    }

    #search-area.searching #search-expanded {
      display: flex;
    }

    #search-expanded .search-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      padding: 6px 0;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      min-width: 0;
    }

    #search-input::placeholder {
      color: var(--text-muted);
    }

    .search-results-count {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .search-results-count.has-results {
      color: var(--accent);
    }

    .search-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .search-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .search-nav-btn:hover:not(:disabled) {
      color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    .search-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .search-nav-btn svg {
      width: 14px;
      height: 14px;
    }

    .search-close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .search-close-btn:hover {
      background: var(--error);
      color: white;
    }

    .search-close-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Toolbar row (search + workflows side by side) */
    #toolbar-row {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Workflows Area */
    #workflows-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      min-height: 30px;
    }

    .workflows-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      height: 30px;
      box-sizing: border-box;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .workflows-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    .workflows-toggle svg {
      width: 14px;
      height: 14px;
    }

    #workflows-area.active .workflows-toggle {
      display: none;
    }

    #workflows-expanded {
      display: none;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #workflows-area.active #workflows-expanded {
      display: flex;
    }

    #workflows-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .workflow-btn {
      padding: 6px 12px;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 16px;
      color: var(--accent-hover);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .workflow-btn:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: var(--accent);
      color: white;
      transform: translateY(-1px);
    }

    .workflows-close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .workflows-close-btn:hover {
      background: var(--error);
      color: white;
    }

    .workflows-close-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Background Tasks Area */
    #background-tasks-area {
      flex-shrink: 0;
      margin-left: auto;
      position: relative;
    }

    .background-tasks-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .background-tasks-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(168, 85, 247, 0.1);
    }

    .bg-task-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: bgPulse 1.5s ease-in-out infinite;
    }

    @keyframes bgPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(168, 85, 247, 0); }
    }

    .bg-task-count {
      font-weight: 700;
      font-size: 11px;
      min-width: 14px;
      text-align: center;
    }

    /* Dropdown (hidden by default, appears above the toggle) */
    #background-tasks-dropdown {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      right: 0;
      min-width: 260px;
      max-width: 340px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      z-index: 50;
    }

    #background-tasks-area.active #background-tasks-dropdown {
      display: block;
    }

    .bg-dropdown-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-tertiary);
    }

    .bg-dropdown-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .bg-dropdown-back:hover {
      background: var(--bg-primary);
      color: var(--text-primary);
    }

    .bg-dropdown-back svg {
      width: 16px;
      height: 16px;
    }

    .bg-dropdown-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    #background-tasks-list {
      display: flex;
      flex-direction: column;
      max-height: 200px;
      overflow-y: auto;
    }

    .bg-task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .bg-task-item:last-child {
      border-bottom: none;
    }

    .bg-task-item:hover {
      background: rgba(168, 85, 247, 0.05);
    }

    .bg-task-item .bg-task-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: bgPulse 1.5s ease-in-out infinite;
    }

    .bg-task-item .bg-task-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
    }

    .bg-task-item .bg-task-type {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-hover);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .bg-task-item .bg-task-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      background: transparent;
      border: none;
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
      opacity: 0;
    }

    .bg-task-item:hover .bg-task-close {
      opacity: 1;
    }

    .bg-task-close:hover {
      background: var(--error);
      color: white;
    }

    .bg-task-close svg {
      width: 12px;
      height: 12px;
    }

    /* Workflow badge in input area */
    .workflow-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.2));
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      color: var(--accent-hover);
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      margin-right: 6px;
      flex-shrink: 0;
    }

    .workflow-badge-remove {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }

    .workflow-badge-remove:hover {
      color: var(--error);
    }

    .workflow-badge-remove svg {
      width: 10px;
      height: 10px;
    }

    #workflow-badge-container {
      display: flex;
      align-items: center;
      align-self: center;
    }

    /* Search highlight */
    mark.search-highlight {
      background: rgba(168, 85, 247, 0.4);
      color: inherit;
      border-radius: 2px;
      padding: 0 2px;
    }

    mark.search-highlight.current {
      background: var(--accent);
      color: white;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      gap: 16px;
      padding: 40px;
      animation: emptyStateIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes emptyStateIn {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .empty-state .empty-emoji {
      font-size: 56px;
      animation: wave 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50%, 100% { transform: rotate(0deg); }
    }

    .empty-state .empty-title {
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .empty-state .empty-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      max-width: 280px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 14px;
      text-align: center;
    }

    /* Date separator timestamp */
    .timestamp {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding: 8px 0;
    }

    /* Message timestamp */
    .message-timestamp {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: right;
      opacity: 0.7;
    }

    .message.user .message-timestamp {
      color: rgba(255, 255, 255, 0.6);
    }

    .message-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .message:hover .message-footer {
      opacity: 1;
    }

    .message-copy-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 2px 8px;
      transition: color 0.15s, border-color 0.15s;
    }

    .message-copy-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    /* File Input (hidden) */
    #file-input {
      display: none;
    }

    /* Attachments */
    .attachments-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border-top: 1px solid var(--border);
      max-height: 120px;
      overflow-y: auto;
    }

    .attachment-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--text-secondary);
      max-width: 200px;
    }

    .attachment-preview img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
    }

    .attachment-icon {
      min-width: 28px;
      height: 24px;
      padding: 0 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-tertiary);
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .attachment-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .attachment-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .attachment-size {
      font-size: 11px;
      color: var(--text-muted);
    }

    .attachment-remove {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1;
      padding: 0;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .attachment-remove:hover {
      background: var(--error);
      color: white;
    }

    /* Drag and Drop Overlay */
    .drag-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(168, 85, 247, 0.1);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      pointer-events: none;
    }

    .drag-overlay.active {
      display: flex;
    }

    .drag-overlay-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 64px;
      background: var(--bg-secondary);
      border: 2px dashed var(--accent);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
    }

    .drag-overlay-icon {
      width: 64px;
      height: 64px;
      color: var(--accent);
      animation: bounce 0.6s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .drag-overlay-text {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .drag-overlay-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Attachment in messages */
    .message-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .message-attachment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.3;
      margin: 2px 0;
    }

    .message-attachment img {
      max-width: 200px;
      max-height: 150px;
      border-radius: 6px;
    }

    /* Response media images (from agent screenshots/tools) */
    .message-media {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .message-media img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .message-media img:hover {
      opacity: 0.9;
    }

    .message img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="status-dot"></div>
      <h1>Pocket Agent<span id="version-badge" class="version-badge"></span><span id="model-badge" class="model-badge"></span></h1>
    </div>
    <div class="header-right">
      <button class="tts-toggle" id="tts-toggle" onclick="toggleAutoTTS()" title="Auto-read: OFF (click to enable)">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <button class="tts-toggle" onclick="openEmailProcessing()" title="Email Processing">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </button>
      <button class="tts-toggle" onclick="openAllTasks()" title="All Tasks">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="8" x2="18" y2="8"/>
          <line x1="9" y1="12" x2="18" y2="12"/>
          <line x1="9" y1="16" x2="18" y2="16"/>
          <circle cx="6" cy="8" r="0.5" fill="currentColor"/>
          <circle cx="6" cy="12" r="0.5" fill="currentColor"/>
          <circle cx="6" cy="16" r="0.5" fill="currentColor"/>
        </svg>
      </button>
      <div class="stats" id="stats"></div>
      <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleMenu()" id="hamburger-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="menu-dropdown" id="menu-dropdown">
          <button class="menu-item" onclick="clearChat(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Fresh Start
          </button>
          <button class="menu-item" onclick="showFacts(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10H12V2z"/>
              <path d="M12 2a10 10 0 0 1 10 10"/>
              <circle cx="12" cy="12" r="6"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
            My Brain
          </button>
          <button class="menu-item" onclick="showSoul(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            My Approach
          </button>
          <button class="menu-item" onclick="openFactsGraph(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="6" cy="6" r="3"/>
              <circle cx="18" cy="6" r="3"/>
              <circle cx="6" cy="18" r="3"/>
              <circle cx="18" cy="18" r="3"/>
              <line x1="8.5" y1="7.5" x2="15.5" y2="16.5"/>
              <line x1="15.5" y1="7.5" x2="8.5" y2="16.5"/>
            </svg>
            Mind Map
          </button>
          <button class="menu-item" onclick="openCustomize(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            Personalize
          </button>
          <button class="menu-item" onclick="openRoutines(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            Routines
          </button>
          <button class="menu-item" onclick="openProjects(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1"/>
              <rect x="14" y="3" width="7" height="7" rx="1"/>
              <rect x="3" y="14" width="7" height="7" rx="1"/>
              <rect x="14" y="14" width="7" height="7" rx="1"/>
            </svg>
            Projects
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item" onclick="openDocs(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            Docs
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item" onclick="openSettings(); closeMenu();">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Settings
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="tabs-container" id="tabs-container">
    <!-- Tabs will be populated by JavaScript -->
    <button class="new-tab-btn" onclick="createNewSession()" title="New chat">+</button>
  </div>

  <div id="messages"></div>

  <button id="scroll-top-btn" class="scroll-btn" style="display:none; top: 80px;" onclick="scrollToTop()" title="Scroll to top">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <button id="scroll-bottom-btn" class="scroll-btn" style="display:none; bottom: 100px;" onclick="scrollToBottom()" title="Scroll to bottom">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- Toolbar Row (Search + Workflows) -->
  <div id="toolbar-row">
    <div id="search-area">
      <!-- Toggle Button (shown by default) -->
      <button class="search-toggle" id="search-toggle-btn" onclick="playNormalClick(); toggleSearch()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>search</span>
      </button>
      <!-- Search Input (hidden by default) -->
      <div id="search-expanded">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search in chat..." oninput="handleSearchInput(event)" onkeydown="handleSearchKeydown(event)">
        <span id="search-results-count" class="search-results-count"></span>
        <div class="search-nav">
          <button class="search-nav-btn" id="search-prev-btn" onclick="playNormalClick(); navigateSearch(-1)" title="Previous" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
          <button class="search-nav-btn" id="search-next-btn" onclick="playNormalClick(); navigateSearch(1)" title="Next" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
        <button class="search-close-btn" onclick="playNormalClick(); closeSearch()" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Workflows Area -->
    <div id="workflows-area">
      <button class="workflows-toggle" onclick="playNormalClick(); toggleWorkflows()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        <span>workflows</span>
      </button>
      <div id="workflows-expanded">
        <div id="workflows-grid"></div>
        <button class="workflows-close-btn" onclick="playNormalClick(); closeWorkflows()" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Background Tasks Indicator (pushed to right) -->
    <div id="background-tasks-area" style="display: none;">
      <button class="background-tasks-toggle" onclick="playNormalClick(); toggleBackgroundTasks()">
        <span class="bg-task-pulse"></span>
        <span class="bg-task-count">0</span>
        <span>background</span>
      </button>
      <div id="background-tasks-dropdown">
        <div class="bg-dropdown-header">
          <button class="bg-dropdown-back" onclick="playNormalClick(); closeBackgroundTasks()" title="Close">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <span class="bg-dropdown-title">Background Tasks</span>
        </div>
        <div id="background-tasks-list"></div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-container">
      <button class="attach-btn" onclick="triggerAttach()" title="Drop a file">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <button class="voice-btn" id="voice-btn" onclick="toggleRecording()" title="Record voice message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <span id="workflow-badge-container"></span>
      <div class="textarea-wrapper">
        <div id="ghost-suggestion"></div>
        <textarea
          id="message-input"
          placeholder="what's on your mind? ✨"
          rows="1"
          onkeydown="handleKeydown(event)"
          oninput="handleInput(event)"
        ></textarea>
      </div>
    </div>
    <button id="send-btn" onclick="handleSendClick()" title="Send it!">
      <svg class="send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      <svg class="stop-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>
    </button>

    // ============ Voice Recording (Raw PCM capture + macOS Speech Recognition) ============

    let recAudioContext = null;
    let recSource = null;
    let recProcessor = null;
    let recStream = null;
    let recChunks = [];
    let isRecording = false;
    let recordingTimer = null;
    let recordingStartTime = null;
    let nextMessageIsVoice = false;

    function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      // Request microphone permission from macOS first
      try {
        const permResult = await window.pocketAgent.requestMicPermission();
        if (!permResult.granted) {
          addMessage('error', 'Microphone access denied. Allow in System Settings > Privacy & Security > Microphone.');
          return;
        }
      } catch (e) {
        console.warn('Mic permission check failed:', e);
      }

      try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true } });
        recChunks = [];

        // Capture raw PCM samples directly (avoids webm format conversion issues)
        recAudioContext = new AudioContext({ sampleRate: 16000 });
        recSource = recAudioContext.createMediaStreamSource(recStream);
        recProcessor = recAudioContext.createScriptProcessor(4096, 1, 1);

        recProcessor.onaudioprocess = function(e) {
          if (isRecording) {
            var channelData = e.inputBuffer.getChannelData(0);
            recChunks.push(new Float32Array(channelData));
          }
        };

        recSource.connect(recProcessor);
        recProcessor.connect(recAudioContext.destination);

        isRecording = true;
        recordingStartTime = Date.now();

        var voiceBtn = document.getElementById('voice-btn');
        voiceBtn.classList.add('recording');
        voiceBtn.title = 'Stop recording';

        updateRecordingTimer();
        recordingTimer = setInterval(updateRecordingTimer, 1000);
      } catch (err) {
        console.error('Failed to start recording:', err);
        addMessage('error', 'Failed to access microphone.');
      }
    }

    async function stopRecording() {
      if (!isRecording) { resetRecordingUI(); return; }
      isRecording = false;

      // Disconnect audio nodes
      if (recProcessor) { recProcessor.disconnect(); recProcessor = null; }
      if (recSource) { recSource.disconnect(); recSource = null; }
      if (recAudioContext) { recAudioContext.close(); recAudioContext = null; }
      if (recStream) { recStream.getTracks().forEach(function(t) { t.stop(); }); recStream = null; }

      clearInterval(recordingTimer);
      recordingTimer = null;

      if (recChunks.length === 0) { resetRecordingUI(); return; }

      input.placeholder = 'Transcribing...';
      var voiceBtn = document.getElementById('voice-btn');
      voiceBtn.classList.remove('recording');

      try {
        // Merge PCM chunks and encode as WAV
        var wavBuffer = encodePcmToWav(recChunks, 16000);
        recChunks = [];

        var result = await window.pocketAgent.transcribeAudio(wavBuffer);
        resetRecordingUI();

        if (result.success && result.text) {
          input.value = result.text;
          autoResizeTextarea();
          nextMessageIsVoice = true;
          sendMessage();
        } else {
          addMessage('error', result.error || 'Transcription failed.');
        }
      } catch (err) {
        console.error('Transcription error:', err);
        resetRecordingUI();
        addMessage('error', 'Failed to transcribe: ' + (err.message || err));
      }
    }

    function resetRecordingUI() {
      isRecording = false;
      clearInterval(recordingTimer);
      recordingTimer = null;
      recChunks = [];

      var voiceBtn = document.getElementById('voice-btn');
      voiceBtn.classList.remove('recording');
      voiceBtn.title = 'Record voice message';
      input.placeholder = "what's on your mind? \u2728";
    }

    var MAX_RECORDING_SECS = 15 * 60; // 15 minutes

    function updateRecordingTimer() {
      var elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
      if (elapsed >= MAX_RECORDING_SECS) {
        stopRecording();
        return;
      }
      var remaining = MAX_RECORDING_SECS - elapsed;
      var mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
      var secs = (elapsed % 60).toString().padStart(2, '0');
      if (remaining <= 60) {
        input.placeholder = '\uD83D\uDD34 Recording... ' + mins + ':' + secs + ' (' + remaining + 's left)';
      } else {
        input.placeholder = '\uD83D\uDD34 Recording... ' + mins + ':' + secs;
      }
    }

    // Encode raw Float32 PCM chunks directly to WAV (no format conversion needed)
    function encodePcmToWav(chunks, sampleRate) {
      // Calculate total length
      var totalSamples = 0;
      for (var c = 0; c < chunks.length; c++) totalSamples += chunks[c].length;

      var dataLength = totalSamples * 2; // 16-bit = 2 bytes per sample
      var buffer = new ArrayBuffer(44 + dataLength);
      var view = new DataView(buffer);

      // WAV header
      writeWavStr(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataLength, true);
      writeWavStr(view, 8, 'WAVE');
      writeWavStr(view, 12, 'fmt ');
      view.setUint32(16, 16, true);       // chunk size
      view.setUint16(20, 1, true);        // PCM format
      view.setUint16(22, 1, true);        // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // byte rate
      view.setUint16(32, 2, true);        // block align
      view.setUint16(34, 16, true);       // bits per sample
      writeWavStr(view, 36, 'data');
      view.setUint32(40, dataLength, true);

      // Write PCM samples
      var offset = 44;
      for (var i = 0; i < chunks.length; i++) {
        var chunk = chunks[i];
        for (var j = 0; j < chunk.length; j++) {
          var s = Math.max(-1, Math.min(1, chunk[j]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          offset += 2;
        }
      }

      return buffer;
    }

    function writeWavStr(view, offset, str) {
      for (var i = 0; i < str.length; i++) {
        view.setUint8(offset + i, str.charCodeAt(i));
      }
    }

    // ============ All Tasks (opens Kanban) ============

    function openAllTasks() {
      window.pocketAgent.openKanban();
    }

    function openEmailProcessing() {
      window.pocketAgent.openEmailProcessing();
    }

    // ============ Text-to-Speech (Edge TTS - Brian) ============

    let autoTTSEnabled = false;
    let currentTTSAudio = null;
    let ttsSynthesizing = false;

    async function initTTS() {
      try {
        const setting = await window.pocketAgent.getSetting('voice.ttsEnabled');
        autoTTSEnabled = setting === 'true';
        updateTTSToggleUI();
      } catch (e) {
        console.warn('Failed to init TTS setting:', e);
      }
    }

    function updateTTSToggleUI() {
      const toggle = document.getElementById('tts-toggle');
      if (toggle) {
        toggle.classList.toggle('active', autoTTSEnabled);
        if (autoTTSEnabled) {
          // Speaker with sound waves = auto-play ON
          toggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
          toggle.title = 'Auto-read: ON (click to silence)';
        } else {
          // Speaker with X = silent/muted
          toggle.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
          toggle.title = 'Auto-read: OFF (click to enable)';
        }
      }
    }

    async function toggleAutoTTS() {
      autoTTSEnabled = !autoTTSEnabled;
      updateTTSToggleUI();
      try {
        await window.pocketAgent.setSetting('voice.ttsEnabled', autoTTSEnabled.toString());
      } catch (e) {
        console.warn('Failed to save TTS setting:', e);
      }
    }

    var TTS_PLAY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
    var TTS_STOP_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

    function setTTSButtonState(btn, playing) {
      if (!btn) return;
      if (playing) {
        btn.classList.add('playing');
        btn.innerHTML = TTS_STOP_ICON;
        btn.title = 'Stop';
      } else {
        btn.classList.remove('playing');
        btn.innerHTML = TTS_PLAY_ICON;
        btn.title = 'Read aloud';
      }
    }

    function stopTTS() {
      if (currentTTSAudio) {
        currentTTSAudio.pause();
        currentTTSAudio = null;
      }
      ttsSynthesizing = false;
      document.querySelectorAll('.tts-play-btn.playing').forEach(function(btn) { setTTSButtonState(btn, false); });
    }

    async function playTTS(text, buttonEl) {
      // If anything is currently playing or synthesizing, stop it
      if (currentTTSAudio || ttsSynthesizing) {
        stopTTS();
        return;
      }

      ttsSynthesizing = true;
      try {
        setTTSButtonState(buttonEl, true);

        const result = await window.pocketAgent.synthesizeTTS(text);
        if (!ttsSynthesizing) return; // Was cancelled during synthesis
        if (!result.success) {
          console.error('TTS failed:', result.error);
          ttsSynthesizing = false;
          setTTSButtonState(buttonEl, false);
          return;
        }

        const audio = new Audio('file://' + result.audioPath);
        currentTTSAudio = audio;

        audio.onended = function() {
          currentTTSAudio = null;
          ttsSynthesizing = false;
          setTTSButtonState(buttonEl, false);
        };

        audio.onerror = function() {
          currentTTSAudio = null;
          ttsSynthesizing = false;
          setTTSButtonState(buttonEl, false);
          console.error('Failed to play TTS audio');
        };

        await audio.play();
      } catch (err) {
        currentTTSAudio = null;
        ttsSynthesizing = false;
        setTTSButtonState(buttonEl, false);
        console.error('TTS playback error:', err);
      }
    }

    function addTTSButton(messageElement, text) {
      const btn = document.createElement('button');
      btn.className = 'tts-play-btn';
      btn.title = 'Read aloud';
      btn.innerHTML = TTS_PLAY_ICON;
      btn.onclick = function(e) {
        e.stopPropagation();
        playTTS(text, btn);
      };

      // Add after the timestamp
      const timestamp = messageElement.querySelector('.message-timestamp');
      if (timestamp) {
        timestamp.style.display = 'inline-block';
        timestamp.parentNode.insertBefore(btn, timestamp.nextSibling);
      } else {
        messageElement.appendChild(btn);
      }
    }

    // Session state
    const MAX_TABS = 5;
    let sessions = [];
    let currentSessionId = 'default';
    const tabsContainer = document.getElementById('tabs-container');

    // Allowed file types
    const ALLOWED_EXTENSIONS = new Set([
      // Text/Code
      'txt', 'md', 'json', 'csv', 'xml', 'html', 'htm', 'css', 'js', 'ts', 'jsx', 'tsx',
      'py', 'rb', 'go', 'rs', 'java', 'c', 'cpp', 'h', 'hpp', 'sh', 'yaml', 'yml',
      'toml', 'ini', 'cfg', 'conf', 'log', 'sql', 'graphql',
      // Images
      'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico',
      // Documents
      'pdf', 'docx', 'doc', 'rtf', 'odt', 'pages',
      'xlsx', 'xls', 'ods', 'numbers',
      'pptx', 'ppt', 'odp', 'keynote',
      'epub', 'zip', 'tar', 'gz'
    ]);

    const IMAGE_EXTENSIONS = new Set(['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico']);
    const EXTRACTABLE_EXTENSIONS = new Set([
      'docx', 'pptx', 'xlsx', 'odt', 'odp', 'ods', 'rtf'
    ]);
    const BINARY_EXTENSIONS = new Set([
      'pdf', 'doc', 'pages',
      'xls', 'numbers',
      'ppt', 'keynote',
      'epub', 'zip', 'tar', 'gz'
    ]);
