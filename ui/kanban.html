    function renderAttachmentItem(att) {
      const iconMap = { file: '&#x1F4C4;', screenshot: '&#x1F5BC;', link: '&#x1F517;', folder: '&#x1F4C1;' };
      const icon = iconMap[att.type] || '&#x1F4CE;';
      let thumbnailHtml = '';
      if (att.type === 'screenshot' && att.path) {
        thumbnailHtml = `<img class="attachment-thumbnail" src="file://${escapeAttr(att.path)}" alt="">`;
      }
      return `
        <div class="attachment-item" onclick="openAttachment('${escapeAttr(att.type)}', '${escapeAttr(att.path)}')">
          ${thumbnailHtml || `<span class="attachment-icon">${icon}</span>`}
          <span class="attachment-name">${escapeHtml(att.name || att.path)}</span>
          <button class="attachment-delete" onclick="event.stopPropagation();deleteAttachment(${att.id})" title="Remove">&times;</button>
        </div>
      `;
    }

    // ── Archive ──
    function toggleArchive() {
      showingArchive = !showingArchive;
      const btn = document.getElementById('archive-btn');
      if (showingArchive) {
        btn.style.background = 'rgba(168,85,247,0.15)';
        btn.style.borderColor = 'var(--accent)';
        btn.style.color = 'var(--text-primary)';
        renderArchiveView();
      } else {
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';
        renderBoard();
      }
    }

    function renderArchiveView() {
      if (!boardData || !boardData.columns) return;
      const doneTasks = boardData.columns['done'] || [];
      const area = document.getElementById('board-area');

      if (doneTasks.length === 0) {
        area.innerHTML = `
          <div class="archive-view">
            <div class="empty-state">
              <p>No archived/done tasks yet.</p>
            </div>
          </div>
        `;
        return;
      }

      let html = '<div class="archive-view">';
      html += `<h3 style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-secondary);">Done Tasks (${doneTasks.length})</h3>`;
      for (const task of doneTasks) {
        const dateStr = task.updated_at ? formatTime(task.updated_at) : '';
        html += `
          <div class="archive-item" onclick="openDetail(${task.id})">
            <span class="archive-item-title">${escapeHtml(task.title)}</span>
            <span class="archive-item-date">${dateStr}</span>
          </div>
        `;
      }
      html += '</div>';
      area.innerHTML = html;
    }

    // ── Search ──
    function setupSearch() {
      const input = document.getElementById('search-input');
      const resultsDiv = document.getElementById('search-results');
      if (!input || !resultsDiv) return;

      let debounceTimer = null;

      input.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        const query = input.value.trim();
        if (query.length < 2) {
          resultsDiv.classList.remove('open');
          resultsDiv.innerHTML = '';
          return;
        }
        debounceTimer = setTimeout(() => doSearch(query), 250);
      });

      input.addEventListener('blur', () => {
        setTimeout(() => resultsDiv.classList.remove('open'), 200);
      });

      input.addEventListener('focus', () => {
        if (resultsDiv.innerHTML.trim()) resultsDiv.classList.add('open');
      });
    }

    async function doSearch(query) {
      const resultsDiv = document.getElementById('search-results');

      try {
        // Search across ALL projects via backend
        const results = await window.pocketAgent.kanbanSearchTasks(query);

        if (!results || results.length === 0) {
          resultsDiv.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:12px;">No results found</div>';
        } else {
          resultsDiv.innerHTML = results.slice(0, 15).map(task => {
            const project = projects.find(p => p.id === task.project_id);
            const projectName = project ? project.name : '';
            const col = COLUMNS.find(c => c.key === task.status);
            const statusLabel = col ? col.label : task.status;
            return `
              <div class="search-result-item" onmousedown="jumpToTask(${task.project_id}, ${task.id})">
                <span class="search-result-title">${escapeHtml(task.title)}</span>
                <span class="search-result-meta">
                  <span>${escapeHtml(projectName)}</span>
                  <span>${escapeHtml(statusLabel)}</span>
                  ${task.priority ? `<span>${escapeHtml(task.priority)}</span>` : ''}
                </span>
              </div>
            `;
          }).join('');
        }
        resultsDiv.classList.add('open');
      } catch {
        resultsDiv.innerHTML = '<div style="padding:12px;color:var(--text-muted);font-size:12px;">Search failed</div>';
        resultsDiv.classList.add('open');
      }
    }

    async function jumpToTask(projectId, taskId) {
      // Switch to the project if needed, then open the task
      if (projectId !== currentProjectId) {
        currentProjectId = projectId;
        document.getElementById('project-select').value = projectId;
        await loadBoard();
      }
      openDetail(taskId);
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').classList.remove('open');
    }

    // ── Workspace ──
    async function openProjectWorkspace() {
      if (!currentProjectId) return;
      const project = projects.find(p => p.id === currentProjectId);
      if (project && project.workspace_path) {
        try {
          await window.pocketAgent.openPath(project.workspace_path);
        } catch (err) {
          showToast('Failed to open workspace', 'error');
        }
      }
    }

    function updateWorkspaceButton() {
      const btn = document.getElementById('workspace-btn');
      if (!btn) return;
      const project = projects.find(p => p.id === currentProjectId);
      if (project && project.workspace_path) {
        btn.style.display = '';
      } else {
        btn.style.display = 'none';
      }
    }

    // ── Utilities ──
    function escapeHtml(text) {
      if (text === null || text === undefined) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function escapeAttr(text) {
      if (text === null || text === undefined) return '';
      return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      try {
        const date = new Date(timestamp);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHrs = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMins < 1) return 'just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHrs < 24) return `${diffHrs}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;
        return date.toLocaleDateString();
      } catch {
        return '';
      }
    }

    function showToast(message, type) {
      const existing = document.querySelector('.toast');
      if (existing) {
        existing.classList.add('exiting');
        setTimeout(() => existing.remove(), 300);
      }

      const toast = document.createElement('div');
      toast.className = `toast ${type || ''}`;
      toast.innerHTML = `
        <div class="toast-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            ${type === 'success'
              ? '<path d="M20 6L9 17l-5-5"/>'
              : '<circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>'}
          </svg>
        </div>
        <div class="toast-content">
          <div class="toast-message">${escapeHtml(message)}</div>
        </div>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('exiting');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
