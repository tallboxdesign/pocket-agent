        loadPosts();
      } catch (err) {
        showToast('Failed to schedule', 'error');
      }
    }

    // Random jitter: base delay +/- 10-70 seconds so posts aren't exactly evenly spaced
    function jitterMs(baseMinutes) {
      const jitterSec = 10 + Math.floor(Math.random() * 61); // 10-70 seconds
      return baseMinutes * 60000 + jitterSec * 1000;
    }

    async function scheduleAllDrafts() {
      try {
        const delayStr = await window.pocketAgent.getSetting('linkedin.commentDelay') || '3';
        const delayMin = Math.max(1, parseInt(delayStr, 10) || 3);
        // Find approved, unscheduled, uncommented posts with drafts
        const eligible = currentPosts.filter(p => p.approved && !isPublishedPost(p) && p.comment_draft && !p.scheduled_at);
        if (eligible.length === 0) { showToast('No approved drafts to schedule', 'info'); return; }
        // Sort by priority: urgent > high > normal > low
        const priOrder = { urgent: 0, high: 1, normal: 2, low: 3 };
        eligible.sort((a, b) => (priOrder[a.priority] ?? 2) - (priOrder[b.priority] ?? 2));
        // Schedule starting from now + 1 minute, spaced by delay with random jitter
        let cumulativeMs = 60000; // start 1 min from now
        let scheduled = 0;
        for (let i = 0; i < eligible.length; i++) {
          if (i > 0) cumulativeMs += jitterMs(delayMin);
          const dt = new Date(Date.now() + cumulativeMs);
          const iso = dt.toISOString().replace('T', ' ').slice(0, 19);
          const result = await window.pocketAgent.scheduleLinkedInPost(eligible[i].id, iso);
          if (result.success) scheduled++;
          if (result?.warning) showToast(result.warning, 'error');
        }
        showToast(`Scheduled ${scheduled} posts (~${delayMin}min apart)`, 'success');
        loadPosts();
      } catch (err) {
        console.error('scheduleAllDrafts failed:', err);
        showToast('Failed to schedule: ' + err.message, 'error');
      }
    }

    let sortField = null;
    let sortAsc = true;

    function toggleSort(field) {
      if (sortField === field) { sortAsc = !sortAsc; }
      else { sortField = field; sortAsc = true; }
      loadPosts();
    }

    function applySorting(posts) {
      if (!sortField) return posts;
      const PRIO_ORDER = { urgent: 0, high: 1, normal: 2, low: 3 };
      return [...posts].sort((a, b) => {
        let va, vb;
        switch (sortField) {
          case 'reactions': va = a.reactions || 0; vb = b.reactions || 0; break;
          case 'comments': va = a.comments || 0; vb = b.comments || 0; break;
          case 'author': va = (a.author || '').toLowerCase(); vb = (b.author || '').toLowerCase(); break;
          case 'priority': va = PRIO_ORDER[a.priority] ?? 2; vb = PRIO_ORDER[b.priority] ?? 2; break;
          case 'type': va = a.post_type || ''; vb = b.post_type || ''; break;
          case 'status':
            va = isPublishedPost(a) ? 3 : a.approved ? 2 : a.comment_draft ? 1 : 0;
            vb = isPublishedPost(b) ? 3 : b.approved ? 2 : b.comment_draft ? 1 : 0;
            break;
          default: return 0;
        }
        const cmp = va < vb ? -1 : va > vb ? 1 : 0;
        return sortAsc ? cmp : -cmp;
      });
    }

    function applyFilters(posts) {
      const status = getInputValue('filter-status');
      const priority = getInputValue('filter-priority');
      const type = getInputValue('filter-type');
      const author = getInputValue('filter-author').toLowerCase();

      return posts.filter(p => {
        const lastAction = String(p.last_activity_action || '').toLowerCase();
        const isPublished = isPublishedPost(p);
        const hasPostingFail = !isPublished && (lastAction === 'failed' || lastAction === 'error' || lastAction === 'verify_needed') && !p.scheduled_at;
        const hasFailed = !isPublished && (Number(p.failed_attempts || 0) > 0 && !p.scheduled_at || hasPostingFail);
        const recheckCandidate = !isPublished && Number(p.recheck_candidate || 0) === 1;
        const needsAttention = !!(p.approved && !isPublished && (!p.scheduled_at || hasFailed)) || recheckCandidate;

        if (activePanel === 'queue' && isPublished) return false;
        if (activePanel === 'published' && !isPublished) return false;
        if (activePanel === 'attention' && !needsAttention) return false;
        if (activePanel === 'failed' && !hasFailed) return false;

        if (status === 'undrafted' && (p.comment_draft || isPublished)) return false;
        if (status === 'draft' && (!p.comment_draft || isPublished)) return false;
        if (status === 'approved' && (!p.approved || isPublished)) return false;
        if (status === 'commented' && !isPublished) return false;
        if (status === 'failed' && !hasFailed) return false;
        if (priority && (p.priority || 'normal') !== priority) return false;
        if (type && p.post_type !== type) return false;
        if (author && !(p.author || '').toLowerCase().includes(author)) return false;
        return true;
      });
    }

    async function loadPosts() {
      try {
        // Load daily stats in parallel
        if (window.pocketAgent.getLinkedInDailyStats) {
          window.pocketAgent.getLinkedInDailyStats().then(stats => {
            const el = document.getElementById('daily-stats');
            if (el && stats && stats.dailyLimit > 0) {
              el.textContent = `${stats.postedToday}/${stats.dailyLimit} posted`;
            }
          }).catch(() => {});
        }
        const date = datePicker.value;
        const result = await window.pocketAgent.listLinkedInPosts(date);
        // Handle both old format (array) and new format ({posts, snoozed})
        const posts = Array.isArray(result) ? result : (result.posts || []);
        const snoozed = Array.isArray(result) ? [] : (result.snoozed || []);
        currentPosts = posts;
        currentSnoozed = snoozed;
        const queueCount = posts.filter(p => !isPublishedPost(p)).length;
        const publishedCount = posts.filter(p => isPublishedPost(p)).length;
        const failedCount = posts.filter(p => {
          if (isPublishedPost(p)) return false;
          const la = String(p.last_activity_action || '').toLowerCase();
          return (Number(p.failed_attempts || 0) > 0 || la === 'failed' || la === 'error' || la === 'verify_needed') && !p.scheduled_at;
        }).length;
        const attentionCount = posts.filter(p => {
          const isPublished = isPublishedPost(p);
          const la = String(p.last_activity_action || '').toLowerCase();
          const hf = ((Number(p.failed_attempts || 0) > 0 || la === 'failed' || la === 'error' || la === 'verify_needed') && !p.scheduled_at);
          const recheckCandidate = !isPublished && Number(p.recheck_candidate || 0) === 1;
          return !!(p.approved && !isPublished && (!p.scheduled_at || hf)) || recheckCandidate;
        }).length;
        const tabQueue = document.getElementById('tab-queue');
        const tabAttention = document.getElementById('tab-attention');
        const tabFailed = document.getElementById('tab-failed');
        const tabPublished = document.getElementById('tab-published');
        if (tabQueue) tabQueue.textContent = `Queue (${queueCount})`;
        if (tabAttention) tabAttention.textContent = `Needs Attention (${attentionCount})`;
        if (tabFailed) tabFailed.textContent = `Failed (${failedCount})`;
        if (tabPublished) tabPublished.textContent = `Published (${publishedCount})`;
        refreshPanelTabs();
        // Draft state is read from DB (p.draft_state) — no transient pruning needed

        const filtered = applySorting(applyFilters(posts));
        const content = document.getElementById('content');
        const countEl = document.getElementById('post-count');

        const drafted = posts.filter(p => p.comment_draft && !isPublishedPost(p)).length;
        const commented = posts.filter(p => isPublishedPost(p)).length;
        const approvedPending = posts.filter(p => p.approved && !isPublishedPost(p)).length;
        const parts = [`${posts.length} posts`];
        if (drafted) parts.push(`${drafted} drafted`);
        if (approvedPending) parts.push(`${approvedPending} approved`);
        if (commented) parts.push(`${commented} published`);
        if (snoozed.length) parts.push(`${snoozed.length} snoozed`);
        countEl.textContent = `(${parts.join(', ')})`;
        if (filtered.length !== posts.length) {
          countEl.textContent += ` — showing ${filtered.length}`;
        }
        document.getElementById('filter-count').textContent = filtered.length !== posts.length ? `${filtered.length} of ${posts.length}` : '';

        if (posts.length === 0 && snoozed.length === 0) {
          content.innerHTML = `
            <div class="empty-state">
              <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
              <p>No posts scraped for this date</p>
              <p class="hint">Browse your LinkedIn feed to populate the database</p>
            </div>
          `;
          return;
        }

        let html = `
          <table class="posts-table" id="main-table">
            <colgroup>
              <col id="col-w-check" style="width:28px">
              <col id="col-w-num" style="width:24px">
              <col id="col-w-pri" style="width:60px">
              <col id="col-w-author" style="width:120px">
              <col id="col-w-preview">
              <col id="col-w-reacts" style="width:35px">
              <col id="col-w-cmts" style="width:35px">
              <col id="col-w-type" style="width:50px">
              <col id="col-w-status" style="width:90px">
              <col id="col-w-actions" style="width:75px">
            </colgroup>
            <thead>
              <tr>
                <th class="col-check"><input type="checkbox" onchange="toggleSelectAll(this.checked)" /></th>
                <th class="col-num">#</th>
                <th class="col-priority" style="cursor:pointer;position:relative" onclick="toggleSort('priority')">Pri<div class="th-resize-handle" data-col="pri"></div></th>
                <th style="cursor:pointer;position:relative" onclick="toggleSort('author')">Author<div class="th-resize-handle" data-col="author"></div></th>
                <th style="position:relative">Preview<div class="th-resize-handle" data-col="preview"></div></th>
                <th class="col-stats" style="cursor:pointer;position:relative" onclick="toggleSort('reactions')">Reacts<div class="th-resize-handle" data-col="reacts"></div></th>
                <th class="col-stats" style="cursor:pointer;position:relative" onclick="toggleSort('comments')">Cmts<div class="th-resize-handle" data-col="cmts"></div></th>
                <th style="cursor:pointer;position:relative" onclick="toggleSort('type')">Type<div class="th-resize-handle" data-col="type"></div></th>
                <th class="col-status" style="cursor:pointer;position:relative" onclick="toggleSort('status')">Status<div class="th-resize-handle" data-col="status"></div></th>
                <th class="col-actions">Actions</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map((p, i) => renderPostRow(p, i + 1)).join('')}
            </tbody>
          </table>
        `;

        if (snoozed.length > 0) {
          html += `
            <div class="snoozed-section">
              <div class="snoozed-header" onclick="toggleSnoozedSection(this)">
                <span class="arrow">&#9660;</span> Snoozed (${snoozed.length})
              </div>
              <table class="posts-table" id="snoozed-table">
                <colgroup>
                  <col style="width:24px">
                  <col id="col-s-pri" style="width:60px">
                  <col id="col-s-author" style="width:120px">
                  <col id="col-s-preview">
                  <col id="col-s-reacts" style="width:35px">
                  <col id="col-s-cmts" style="width:35px">
                  <col id="col-s-type" style="width:50px">
                  <col id="col-s-status" style="width:90px">
                  <col id="col-s-actions" style="width:75px">
                </colgroup>
                <tbody>
                  ${snoozed.map((p, i) => `
                    <tr>
                      <td class="col-num" style="color:var(--text-muted)">${i + 1}</td>
                      <td class="col-priority">${priorityDot(p.id, p.priority)}</td>
                      <td class="col-author" title="${escapeHtml(p.author)}">${escapeHtml(p.author)}</td>
                      <td class="col-preview">${escapeHtml(truncate(p.text_preview, 80))}</td>
                      <td class="col-stats">${p.reactions || 0}</td>
                      <td class="col-stats">${p.comments || 0}</td>
                      <td class="col-type"><span class="badge badge-snoozed">Until ${new Date(p.snoozed_until + 'Z').toLocaleDateString()}</span></td>
                      <td class="col-status"></td>
                      <td class="col-actions">
                        <button class="icon-btn" onclick="openPostUrl(${p.id})" title="Open in browser">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        content.innerHTML = html;
      } catch (error) {
        console.error('Error loading posts:', error);
        showToast('Could not load posts', 'error');
      }
    }

    function renderPostRow(p, idx) {
      const renderEvidenceBlock = (row) => {
        const hasEvidence = !!(
          row.evidence_stance_basis || row.evidence_actionable_add_on || row.evidence_key_point
          || row.evidence_statistic || row.evidence_source_1_name || row.evidence_source_1_url
          || row.evidence_source_2_name || row.evidence_source_2_url
        );
        if (!hasEvidence) return '';

        const tags = [];
        if (row.evidence_stance_basis) tags.push(`<span class="draft-evidence-tag">basis: ${escapeHtml(String(row.evidence_stance_basis))}</span>`);
        if (row.evidence_comment_intent) tags.push(`<span class="draft-evidence-tag">intent: ${escapeHtml(String(row.evidence_comment_intent))}</span>`);
        if (row.evidence_confidence) tags.push(`<span class="draft-evidence-tag">confidence: ${escapeHtml(String(row.evidence_confidence))}</span>`);

        const sourceBits = [];
        if (row.evidence_source_1_name || row.evidence_source_1_url) {
          const n = escapeHtml(String(row.evidence_source_1_name || 'source 1'));
          const u = escapeHtml(String(row.evidence_source_1_url || ''));
          sourceBits.push(u ? `${n} (${u})` : n);
        }
        if (row.evidence_source_2_name || row.evidence_source_2_url) {
          const n = escapeHtml(String(row.evidence_source_2_name || 'source 2'));
          const u = escapeHtml(String(row.evidence_source_2_url || ''));
          sourceBits.push(u ? `${n} (${u})` : n);
        }
        const evidenceAt = row.evidence_created_at ? formatShortDateTime(row.evidence_created_at) : '';

        return `
          <div class="draft-evidence">
            <div class="draft-evidence-title">
              <span>Why this draft</span>
              ${evidenceAt ? `<span style="opacity:.75;font-weight:500">${escapeHtml(evidenceAt)}</span>` : ''}
            </div>
            ${tags.length ? `<div class="draft-evidence-tags">${tags.join('')}</div>` : ''}
            ${row.evidence_key_point ? `<div class="draft-evidence-line"><strong>Anchor:</strong> ${escapeHtml(truncate(String(row.evidence_key_point), 220))}</div>` : ''}
            ${row.evidence_statistic ? `<div class="draft-evidence-line"><strong>Research cue:</strong> ${escapeHtml(truncate(String(row.evidence_statistic), 240))}</div>` : ''}
            ${row.evidence_actionable_add_on ? `<div class="draft-evidence-line"><strong>Action add-on:</strong> ${escapeHtml(truncate(String(row.evidence_actionable_add_on), 220))}</div>` : ''}
            ${sourceBits.length ? `<div class="draft-evidence-line"><strong>Sources:</strong> ${sourceBits.join(' | ')}</div>` : ''}
          </div>
        `;
      };

      const ds = p.draft_state || '';
      const isQueued = ds === 'queued' || locallyQueuedDraftPostIds.has(p.id);
      const isResearching = ds === 'researching';
      const isWriting = ds === 'writing';
      const isDraftFailed = ds.startsWith('failed_');
      const isDraftCancelled = ds.startsWith('cancelled_');
      const isPublished = isPublishedPost(p);
      const recheckCandidate = !isPublished && Number(p.recheck_candidate || 0) === 1;
      const gainReactions = Number(p.reactions_gain_since_first || 0);
      const gainComments = Number(p.comments_gain_since_first || 0);
      const seenDays = Number(p.days_since_first_seen || 0);
      const lastAction = String(p.last_activity_action || '').toLowerCase();
      const hasPostingFailure = !isPublished && (lastAction === 'failed' || lastAction === 'error' || lastAction === 'verify_needed') && !p.scheduled_at;
      const hasFailed = isDraftFailed || hasPostingFailure;
      const statusBadges = [];
      if (isResearching) statusBadges.push('<span class="badge badge-researching"><span class="mini-spinner"></span>Researching</span>');
      else if (isWriting) statusBadges.push('<span class="badge badge-researching"><span class="mini-spinner"></span>Writing</span>');
      else if (isQueued) statusBadges.push('<span class="badge badge-queued">Queued</span>');
      if (recheckCandidate) {
        const ageHint = seenDays > 0 ? ` (${seenDays}d)` : '';
        statusBadges.push(`<span class="badge" style="background:rgba(59,130,246,0.14);color:#60a5fa;border:1px solid rgba(96,165,250,0.32)" title="This post gained engagement since first seen and is worth re-checking">Recheck +${Math.max(0, gainReactions)}r +${Math.max(0, gainComments)}c${ageHint}</span>`);
      }
      if (isDraftCancelled) statusBadges.push('<span class="badge badge-rejected">Cancelled</span>');
      const isScheduled = !!(p.approved && p.scheduled_at && !isPublished);
      const scheduledAtMs = parseUtcDateMs(p.scheduled_at);
      const isDueScheduled = isScheduled && Number.isFinite(scheduledAtMs) && scheduledAtMs <= Date.now();
      const activityTime = p.last_activity_at ? formatShortDateTime(p.last_activity_at) : '';
      const tsSuffix = activityTime ? ` <span style="opacity:0.7;font-size:10px">${activityTime}</span>` : '';
      const schTime = formatShortDateTime(p.scheduled_at);
      if (isPublished) statusBadges.push(`<span class="badge badge-commented">Published${tsSuffix}</span>`);
      else if (isDueScheduled) statusBadges.push(`<span class="badge" style="background:rgba(251,146,60,0.14);color:#fb923c;border:1px solid rgba(251,146,60,0.32)" title="Scheduled time passed; waiting for auto-poster window/slot">Due <span style="opacity:0.7;font-size:10px">${schTime}</span></span>`);
      else if (isScheduled) statusBadges.push(`<span class="badge badge-scheduled">Scheduled <span style="opacity:0.7;font-size:10px">${schTime}</span></span>`);
      else if (p.approved || approvedIds.has(p.id)) statusBadges.push(`<span class="badge badge-approved">Approved${tsSuffix}</span>`);
      else if (rejectedIds.has(p.id)) statusBadges.push(`<span class="badge badge-rejected">Rejected${tsSuffix}</span>`);
      else if (p.comment_draft) statusBadges.push(`<span class="badge badge-draft">Draft${tsSuffix}</span>`);
      if (!isPublished && p.approved && !p.scheduled_at) {
        statusBadges.push('<span class="badge" style="background:rgba(251,146,60,0.14);color:#fb923c;border:1px solid rgba(251,146,60,0.32)">Awaiting schedule</span>');
      }
      if (!isPublished && hasFailed) {
        const failReason = String(p.draft_error || p.last_activity_reason || 'Recent failure')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
        const failLabel = lastAction === 'verify_needed'
          ? 'Verify'
          : ds === 'failed_timeout'
            ? 'Timed out'
            : ds === 'failed_quality'
              ? 'Quality fail'
              : ds === 'failed_provider'
                ? 'Provider error'
                : 'Failed';
        statusBadges.push(`<span class="badge badge-rejected" title="${failReason}">${failLabel}</span>`);
      }

      // Engagement delta badge
      const engagementBadge = (p.engagement_checked && (p.reactions_delta || p.comments_delta))
        ? `<span class="badge" style="background:rgba(34,197,94,0.15);color:#4ade80;border-color:rgba(34,197,94,0.3)">+${p.reactions_delta || 0}r +${p.comments_delta || 0}c</span>`
        : '';

      // Relationship badge
      let relationBadge = '';
      const tc = p.author_total_comments || 0;
      if (tc >= 5) relationBadge = '<span class="badge" style="background:rgba(34,197,94,0.12);color:#4ade80;border-color:rgba(34,197,94,0.25)" title="Regular contact">Regular</span>';
      else if (tc >= 1) relationBadge = '<span class="badge" style="background:rgba(245,158,11,0.12);color:#fbbf24;border-color:rgba(245,158,11,0.25)" title="Occasional contact">Occasional</span>';
      else relationBadge = '<span class="badge" style="background:rgba(107,114,128,0.12);color:#9ca3af;border-color:rgba(107,114,128,0.25)" title="New contact">New</span>';

      // Weekly warning
      const weeklyWarn = (p.author_weekly_comments >= 2) ? `<span style="color:var(--warning);font-size:10px">${p.author_weekly_comments}x this week</span>` : '';

      // Reconnect hint
      let reconnectHint = '';
      if (tc >= 5 && p.author_last_commented) {
        const daysSince = Math.floor((Date.now() - new Date(p.author_last_commented).getTime()) / (1000 * 60 * 60 * 24));
        if (daysSince >= 14) reconnectHint = `<span style="color:var(--text-muted);font-size:10px">${daysSince}d ago</span>`;
      }

      const inflightHint = isResearching
        ? '<div class="draft-inflight"><span class="mini-spinner"></span>Researching this post now...</div>'
        : isWriting
        ? '<div class="draft-inflight"><span class="mini-spinner"></span>Writing draft now...</div>'
        : (isQueued ? '<div class="draft-inflight"><span class="mini-spinner"></span>Queued for research and drafting...</div>' : '');
      const failureNote = (!isPublished && hasFailed && p.last_activity_reason)
        ? `<div style="margin-top:6px;font-size:11px;color:#f87171;line-height:1.4">Last error: ${escapeHtml(String(p.last_activity_reason).slice(0, 220))}</div>`
        : '';
      const evidenceBlock = renderEvidenceBlock(p);

      return `
        <tr class="${isPublished ? 'commented' : ''}" data-post-id="${p.id}">
          <td class="col-check"><input type="checkbox" value="${p.id}" onchange="updateSelection()" /></td>
          <td class="col-num">${idx}</td>
          <td class="col-priority">${priorityDot(p.id, p.priority)}</td>
          <td class="col-author" title="${escapeHtml(p.author)}">${escapeHtml(p.author)}<br>${relationBadge} ${weeklyWarn} ${reconnectHint}</td>
          <td class="col-preview">
            ${escapeHtml(truncate(p.text_preview, 100))}
            ${inflightHint}
            ${failureNote}
            ${p.comment_draft ? `
              <div class="draft-actions" style="margin-top:6px">
                <span class="draft-toggle" onclick="toggleDraft(${p.id}, this)" style="margin:0">${expandedDraftId === p.id ? 'Hide draft' : 'Show draft'}</span>
                ${!isPublished && !isScheduled ? `
                  <button class="btn-approve" onclick="approveDraft(${p.id})">Approve</button>
                  <button class="btn-approve" onclick="postNow(${p.id})" style="background:rgba(34,197,94,0.18);color:#4ade80;border-color:rgba(34,197,94,0.4)">Post Now</button>
                  <button class="btn-reject" onclick="rejectDraft(${p.id})">Reject</button>
                  <button class="btn-edit" onclick="editDraft(${p.id})">Edit</button>
                  <button class="btn-redo" onclick="redoDraft(${p.id})">Redo</button>
                  <button class="btn-schedule" onclick="showSchedulePicker(${p.id})">Schedule</button>
                ` : ''}
              </div>
              <div class="draft-text ${expandedDraftId === p.id ? 'expanded' : ''}" id="draft-${p.id}">
                <div class="draft-body" id="draft-content-${p.id}">${escapeHtml(p.comment_draft)}</div>
                ${evidenceBlock}
                <div class="draft-extra" id="draft-extra-${p.id}"></div>
              </div>
            ` : ''}
          </td>
          <td class="col-stats">${p.reactions || 0}</td>
          <td class="col-stats">${p.comments || 0}</td>
          <td class="col-type">${p.post_type ? `<span class="badge badge-type">${escapeHtml(p.post_type)}</span>` : ''}</td>
          <td class="col-status"><div class="status-badges">${statusBadges.join(' ')} ${engagementBadge}</div></td>
          <td class="col-actions">
            <div class="action-icons">
              <button class="icon-btn" onclick="draftSinglePost(${p.id})" title="Research and draft this post now">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.8 3.7L18 8.5l-3 2.9.7 4.1L12 13.8 8.3 15.5l.7-4.1-3-2.9 4.2-.8L12 3z"/></svg>
              </button>
              <button class="icon-btn danger" onclick="hidePost(${p.id})" title="Delete/hide post">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              </button>
              <button class="icon-btn snooze-btn" onclick="showSnoozeDropdown(${p.id}, this)" title="Snooze post">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </button>
              <button class="icon-btn" onclick="openPostUrl(${p.id})" title="Open in browser">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `;
    }

    function openPostUrl(postId) {
      const post = currentPosts.find(p => p.id === postId) || currentSnoozed.find(p => p.id === postId);
      if (post) window.pocketAgent.openExternal(post.post_url);
    }

    function toggleSnoozedSection(header) {
      header.classList.toggle('collapsed');
      const table = document.getElementById('snoozed-table');
      if (table) table.style.display = header.classList.contains('collapsed') ? 'none' : '';
    }

    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) { existing.classList.add('exiting'); setTimeout(() => existing.remove(), 300); }
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<div style="flex:1">${escapeHtml(message)}</div>`;
      document.body.appendChild(toast);
      setTimeout(() => { toast.classList.add('exiting'); setTimeout(() => toast.remove(), 300); }, 2500);
    }

    function reAuthenticate() {
      sendToAgent('Re-authenticate my LinkedIn session. Run linkedin_auth_status with action=setup to open a browser where I can log in.');
    }

    function draftTopN() {
      const count = document.getElementById('draft-count').value;
      const n = count === 'all' ? 'all relevant' : `the top ${count} most relevant`;
      sendToAgent(`Draft comments for ${n} LinkedIn posts from today. Use my configured voice and style. Create kanban tasks for each draft.`);
    }

    function fullPipeline() {
      const count = document.getElementById('draft-count').value;
      const n = count === 'all' ? 'all relevant' : `the top ${count}`;
      sendToAgent(`Full LinkedIn pipeline: Browse my feed, classify and filter posts, draft comments for ${n} posts using my voice and style, create kanban tasks for each, then post all approved comments with the configured delay between each. Post in priority order (urgent first, then high, normal, low). Show me a summary of what was drafted and the posting schedule.`);
    }

    async function sendToAgent(prompt) {
      showToast('Sending to chat...', 'success');
      try {
        await window.pocketAgent.injectChatMessage(prompt);
      } catch (err) {
        console.error('Failed to send:', err);
        showToast('Failed to send command', 'error');
      }
    }

    async function approveDraft(postId) {
      try {
        const post = currentPosts.find(p => p.id === postId);
        if (!post || !post.comment_draft) { showToast('No draft to approve', 'error'); return; }
        await window.pocketAgent.approveLinkedInDraft(postId);
        approvedIds.add(postId);
        // Find latest scheduled time among all posts to offset from
        const delayStr = await window.pocketAgent.getSetting('linkedin.commentDelay') || '3';
        const delayMin = Math.max(1, parseInt(delayStr, 10) || 3);
        const scheduledTimes = currentPosts
          .filter(p => p.scheduled_at && !isPublishedPost(p) && p.id !== postId)
          .map(p => new Date(p.scheduled_at + (p.scheduled_at.includes('Z') ? '' : 'Z')).getTime())
          .filter(t => !isNaN(t));
        const latestScheduled = scheduledTimes.length > 0 ? Math.max(...scheduledTimes) : 0;
        const earliest = Math.max(Date.now() + 60000, latestScheduled + delayMin * 60000);
        const dt = new Date(earliest + jitterMs(0));
        const iso = dt.toISOString().replace('T', ' ').slice(0, 19);
        const result = await window.pocketAgent.scheduleLinkedInPost(postId, iso);
        if (result?.warning) showToast(result.warning, 'error');
        const finalAt = result?.scheduledAt || iso;
        const shifted = Number(result?.adjustedOthers || 0);
        showToast(`Approved, scheduled ${formatShortDateTime(finalAt)}${shifted > 0 ? `, shifted ${shifted} nearby` : ''}`, 'success');
        loadPosts();
      } catch (err) {
        console.error('Failed to approve draft:', err);
        showToast('Failed to approve draft', 'error');
      }
    }

    async function postNow(postId) {
      try {
        const post = currentPosts.find(p => p.id === postId);
        if (!post || !post.comment_draft) { showToast('No draft to post', 'error'); return; }
        if (!post.approved) await window.pocketAgent.approveLinkedInDraft(postId);
        approvedIds.add(postId);
        const iso = new Date(Date.now() + 5000).toISOString().replace('T', ' ').slice(0, 19);
        const result = await window.pocketAgent.scheduleLinkedInPost(postId, iso);
        if (result?.warning) showToast(result.warning, 'error');
        const finalAt = result?.scheduledAt || iso;
        const shifted = Number(result?.adjustedOthers || 0);
        showToast(`Priority scheduled (${formatShortDateTime(finalAt)})${shifted > 0 ? `, shifted ${shifted} nearby` : ''}`, 'success');
        loadPosts();
      } catch (err) {
        console.error('Failed to post now:', err);
        showToast('Failed to schedule immediate post', 'error');
      }
    }

    async function postNowSelected() {
      const ids = getSelectedIds().filter(id => {
        const p = currentPosts.find(pp => pp.id === id);
        return p && p.comment_draft && !isPublishedPost(p);
      });
      if (ids.length === 0) { showToast('No eligible posts selected', 'error'); return; }
      try {
        let cumulativeMs = 0;
        for (let i = 0; i < ids.length; i++) {
          const p = currentPosts.find(pp => pp.id === ids[i]);
          if (!p.approved) await window.pocketAgent.approveLinkedInDraft(ids[i]);
          approvedIds.add(ids[i]);
          if (i === 0) {
            cumulativeMs = 5000; // First one: now
          } else {
            cumulativeMs += jitterMs(3 + Math.random() * 2); // 3-5 min + jitter
          }
          const dt = new Date(Date.now() + cumulativeMs);
          const iso = dt.toISOString().replace('T', ' ').slice(0, 19);
          const result = await window.pocketAgent.scheduleLinkedInPost(ids[i], iso);
          if (result?.warning) showToast(result.warning, 'error');
        }
        showToast(`${ids.length} posts scheduled for immediate posting`, 'success');
        loadPosts();
      } catch (err) {
        console.error('Post now selected failed:', err);
        showToast('Failed to schedule posts', 'error');
      }
    }

    async function rejectDraft(postId) {
      try {
        await window.pocketAgent.rejectLinkedInDraft(postId);
        rejectedIds.add(postId);
        showToast('Draft rejected', 'success');
        loadPosts();
      } catch (err) {
        console.error('Failed to reject draft:', err);
        showToast('Failed to reject draft', 'error');
      }
    }

    function editDraft(postId) {
      const contentEl = document.getElementById('draft-content-' + postId);
      if (!contentEl) return;
      const extraEl = document.getElementById('draft-extra-' + postId);
      if (extraEl) extraEl.innerHTML = '';
      const currentText = contentEl.textContent || '';
      contentEl.innerHTML = `<textarea class="draft-edit-area" id="draft-edit-${postId}">${escapeHtml(currentText)}</textarea>
        <div class="draft-actions" style="margin-top:6px">
          <button class="btn-approve" onclick="saveDraftEdit(${postId})">Save</button>
          <button onclick="loadPosts()">Cancel</button>
        </div>`;
      const textarea = document.getElementById('draft-edit-' + postId);
      if (textarea) textarea.focus();
    }

    async function saveDraftEdit(postId) {
      const textarea = document.getElementById('draft-edit-' + postId);
      if (!textarea) return;
      const newText = textarea.value.trim();
      if (!newText) return;
      try {
        await window.pocketAgent.updateLinkedInDraft(postId, newText);
        showToast('Draft updated', 'success');
        loadPosts();
      } catch (err) {
        console.error('Failed to update draft:', err);
        showToast('Failed to update draft', 'error');
      }
    }

    async function redoDraft(postId) {
      const post = currentPosts.find(p => p.id === postId);
      if (!post) return;
      const postUrl = post.post_url;
      sendToAgent(`Re-draft the LinkedIn comment for post ${postUrl} (post ID ${postId}). The previous draft was rejected for quality issues.

STEP 1: Use linkedin_read_post to read the FULL post content. Actually understand what the author is saying.
STEP 2: Research the topic using web search. Use ONLY this run's research, not model memory. Pick your two-cents basis in this order: contradiction > missing piece > lived experience > logical gap.
STEP 3: Write the comment YOURSELF (do NOT use draft_linkedin_comment). Include something concrete from your research. Think about what a real practitioner would say.
STEP 4: Save it using linkedin_save_draft with the post_id and your draft text. This updates the kanban task too.

YOUR COMMENT MUST:
- Auto-size length from the post depth. Keep it concise if the claim is simple, longer if the claim needs unpacking. Don't pad.
- Start with the author's first name, then reference something SPECIFIC they said.
- Weave in ONE insight from research naturally. Do NOT cite source names, publication names, or exact statistics. Paraphrase loosely like you already knew it.
- Add your own angle or experience. Never just agree.
- Include one clear two-cents stance, then actionable follow-through (mini tutorial step, practical suggestion, or concrete discovery).
- Even if you call something bullshit, leave the reader with useful next-step advice.
- Do NOT end with a question.
- Format as 2-4 short paragraphs with line breaks. No wall of text.
- Sound like someone who genuinely knows their stuff typing a quick reply.

VOICE:
- Vary sentence rhythm. Include short sentences and longer ones.
- Add punctuation texture naturally, use "..." or ";" or an inline "?" mid-comment.
- Lowercase generic acronyms: "seo", "ctr", "aio". Brand names stay capitalized.
- Use one casual connector max: "honestly", "the thing is", "tbh".
- Incomplete thoughts OK: "but yeah." or "..." or starting with "and".
- Challenge marketing stunts. Never be a yes-man. Call out self-promotion with data.

NEVER USE: em dashes, en dashes, "landscape", "crucial", "leverage", "comprehensive", "robust", "ecosystem", "transformative", "cutting-edge", "holistic", "navigate", "streamline", "optimize", "paradigm", "innovative", "unprecedented", "game-changing", "delve", "foster", "harness", "elevate".

If you catch yourself writing any banned word or a dash, rewrite the sentence.`);
    }

    function feedbackDraft(postId) {
      const post = currentPosts.find(p => p.id === postId);
      if (!post) return;
      const postUrl = post.post_url;
      const host = document.getElementById('draft-extra-' + postId);
      if (!host) return;
      const existingInput = host.querySelector('.feedback-input');
      if (existingInput) return;
      const existingPicker = host.querySelector('.schedule-picker');
      if (existingPicker) existingPicker.remove();
      const input = document.createElement('input');
      input.className = 'feedback-input';
      input.placeholder = 'Type revision feedback and press Enter...';
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && input.value.trim()) {
          sendToAgent(`Revise comment draft for ${postUrl}: ${input.value.trim()}`);
          input.remove();
        }
      });
      host.appendChild(input);
      input.focus();
    }

    // Listen for draft progress from parallel agents
    if (window.pocketAgent.onLinkedInDraftProgress) {
      window.pocketAgent.onLinkedInDraftProgress((data) => {
        const d = data;
        if (d && typeof d === 'object') {
          if ('type' in d && d.type === 'researching') {
            showToast(`Researching ${d.author}...`, 'success');
            loadPosts();
          } else if (('type' in d && d.type === 'drafted') || ('draft' in d && 'author' in d)) {
            showToast(`Drafted: ${d.author}`, 'success');
            loadPosts();
          } else if (('type' in d && d.type === 'error') || ('error' in d && 'author' in d)) {
            showToast(`Failed: ${d.author}`, 'error');
            loadPosts();
          } else if ('type' in d && d.type === 'complete') {
            loadPosts();
          } else if ('type' in d && d.type === 'progress' && 'completed' in d && 'total' in d) {
            const countEl = document.getElementById('post-count');
            if (countEl) countEl.textContent = `(drafting ${d.completed}/${d.total}...)`;
          }
        }
      });
    }

    // --- Resizable columns with localStorage persistence ---
    const COL_STORAGE_KEY = 'linkedin-col-widths';
    const RESIZABLE_COLS = ['pri','author','preview','reacts','cmts','type','status','actions'];

    function saveColumnWidths() {
      const widths = {};
      for (const name of RESIZABLE_COLS) {
        const col = document.getElementById('col-w-' + name);
        if (col && col.style.width) widths[name] = col.style.width;
      }
      localStorage.setItem(COL_STORAGE_KEY, JSON.stringify(widths));
    }

    function loadColumnWidths() {
      try {
        const stored = JSON.parse(localStorage.getItem(COL_STORAGE_KEY));
        if (!stored) return;
        for (const [name, w] of Object.entries(stored)) {
          const main = document.getElementById('col-w-' + name);
          const snz = document.getElementById('col-s-' + name);
          if (main) main.style.width = w;
          if (snz) snz.style.width = w;
        }
      } catch {}
    }

    function syncSnoozedWidths() {
      for (const name of RESIZABLE_COLS) {
        const main = document.getElementById('col-w-' + name);
        const snz = document.getElementById('col-s-' + name);
        if (main && snz) snz.style.width = main.style.width;
      }
    }

    function initColumnResize() {
      document.querySelectorAll('.th-resize-handle').forEach(handle => {
        handle.addEventListener('mousedown', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const colName = handle.dataset.col;
          const col = document.getElementById('col-w-' + colName);
          if (!col) return;
          const th = handle.parentElement;
          const startX = e.clientX;
          const startWidth = th.offsetWidth;
          handle.classList.add('active');

          const onMove = (ev) => {
            const newWidth = Math.max(20, startWidth + ev.clientX - startX);
            col.style.width = newWidth + 'px';
            const snz = document.getElementById('col-s-' + colName);
            if (snz) snz.style.width = newWidth + 'px';
          };
          const onUp = () => {
            handle.classList.remove('active');
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            saveColumnWidths();
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      });
    }

    // Apply saved widths on load, init resize after first render
    loadColumnWidths();
    const _origLoadPosts = loadPosts;
    let _resizeInited = false;
    loadPosts = async function() {
      await _origLoadPosts();
      loadColumnWidths();
      syncSnoozedWidths();
      if (!_resizeInited) { _resizeInited = true; initColumnResize(); }
      else { initColumnResize(); }
    };

    refreshPanelTabs();
    loadDraftMode();
    loadPosts();
  </script>
</body>
</html>
